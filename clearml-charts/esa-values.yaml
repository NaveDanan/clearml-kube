global:
  imageRegistry: "clearml"
  imagePullSecrets:
  - nave-pull-secret

imageCredentials:
  enabled: true
  # existingSecret: "artifactory-pull-secret"
  registry: ""
  existingSecret: "nave-pull-secret"

clearml:
  # -- Name fo the UI cookie
  cookieName: "clearml-token-k8s"
  # -- Cookie domain to be left empty if not exposed with an ingress
  cookieDomain: "mems.rafael.co.il"
  # -- Company name
  defaultCompany: "d1bd92a3b039400cbafc60a7a5b1e52b"
  # -- Credentials are supplied only by the externally provisioned Secret below.
  # -- Override the API Urls displayed when showing an example of the SDK's clearml.conf configuration
  clientConfigurationApiUrl: "https://api-clearml.mems.rafael.co.il"
  # -- Override the Files Urls displayed when showing an example of the SDK's clearml.conf configuration
  clientConfigurationFilesUrl: "https://files-clearml.mems.rafael.co.il"
  # -- Must contain the documented ClearML credential keys; see CREDENTIALS.md.
  existingSecret: "clearml-server-secrets"


apiserver:
  enabled: true
  image:
    repository: "clearml"
    pullPolicy: IfNotPresent
    tag: "2026-07-26"
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    hostName: "api-clearml.mems.rafael.co.il"
    tlsSecretName: wildcard-certs-secret
    tls:
      - hosts:
          - api-clearml.mems.rafael.co.il
        secretName: wildcard-certs-secret
    path: "/"    
    pathType: ImplementationSpecific

fileserver:
  enabled: true
  image:
    repository: "clearml"
    pullPolicy: IfNotPresent
    tag: "2026-07-26"
  service:
    type: ClusterIP
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    hostName: "files-clearml.mems.rafael.co.il"
    tlsSecretName: wildcard-certs-secret
    tls:
      - hosts:
          - files-clearml.mems.rafael.co.il
        secretName: wildcard-certs-secret
    path: "/"
    pathType: ImplementationSpecific
  storage:
    enabled: true # Set true for nfs storage and add data section
    data:
      class: "nfs-main"
      accessMode: ReadWriteOnce
      size: 200Gi
  # extraEnvs:
  # - name: CLEARML_FILES_URL
  #   value: "http://minio.minio.svc.cluster.local:9000/label-studio"
  # - name: CLEARML_FILE_STORAGE_DRIVER
  #   value: "s3"
  # - name: CLEARML_S3_ACCESS_KEY_ID
  #   value: "5NFJZVQTFKTXHIT1XM4K6IOI9TJ6G0"
  # - name: CLEARML_S3_SECRECT_ACCESS_KEY
  #   value: "67dXXqKIt5PXuSf885EZg6jphPZJQZ6mHHXS4PHNLSzBM2HL6A1TQ9hCnrVi-5Z5yds"
  # - name: CLEARML_S3_ENDPOINT_URL
  #   value: "http://minio.minio.svc.cluster.local:9000"
  # - name: CLEARML_S3_REGION
  #   value: "il-central-1"
  # - name: CLEARML_S3_SECURE
  #   value: "false"

webserver:
  enabled: true
  image:
    repository: "clearml"
    pullPolicy: IfNotPresent
    tag: "2026-07-26"
  service:
    type: ClusterIP
  additionalConfigs:
    configuration.json: |
      {
        "apiBaseUrl": "https://api-clearml.mems.rafael.co.il",
        "fileBaseUrl": "https://files-clearml.mems.rafael.co.il",
        "displayedServerUrls": {
          "apiServer": "https://api-clearml.mems.rafael.co.il",
          "filesServer": "https://files-clearml.mems.rafael.co.il"
        }
      }
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    hostName: "clearml.mems.rafael.co.il"    
    tlsSecretName: wildcard-certs-secret
    tls:
      - hosts:
          - clearml.mems.rafael.co.il
        secretName: wildcard-certs-secret
    path: "/"
    # tlsSecretName: wildcard-tls
    pathType: ImplementationSpecific

runaiWorker:
  enabled: true
  image:
    repository: "runai-worker"
    pullPolicy: IfNotPresent
    tag: "2026-07-26"
  replicaCount: 1
  pollInterval: 3
  batchSize: 5
  # Trust the internal/company CA so `runai login` and `oc login` do not fail
  # with "x509: certificate signed by unknown authority".
  # Create the secret first, e.g.:
  #   kubectl -n <namespace> create secret generic rf-ca-cert \
  #     --from-file=rf_ca_bundle.crt=./rf_ca_bundle.crt
  caCert:
    enabled: true
    # Name of an existing secret in the release namespace holding the CA bundle.
    existingSecret: "rf-ca-cert"
    # Key inside that secret that contains the PEM bundle.
    secretKey: "rf_ca_bundle.crt"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  enabled: true
  master:
    name: "{{ .Release.Name }}-redis-master"
    port: 6379
    persistence:
      enabled: true
      accessModes:
      - ReadWriteOnce
      size: 10Gi
      storageClass: nfs-main
  architecture: standalone
  image:
    repository: redis
    tag: 7.0.9-debian-11-r1
    pullPolicy: IfNotPresent
    pullSecrets:
    - nave-pull-secret

mongodb:
  enabled: true
  persistence:
    enabled: true
    accessModes:
    - ReadWriteOnce
    size: 10Gi
    storageClass: nfs-main
  image:
    repository: mongodb
    tag: 6.0.10-debian-11-r8
    pullPolicy: IfNotPresent
    # pullSecrets:
    # - clearml-registry-key

elasticsearch:
  image: "clearml/elasticsearch"
  imageTag: "7.17.3"
  imagePullPolicy: "IfNotPresent"
  imagePullSecrets:
    - name: nave-pull-secret
  persistence:
    enabled: true
  volumeClaimTemplate:
    storageClassName: nfs-main
    resources:
      requests:
        storage: 10Gi
