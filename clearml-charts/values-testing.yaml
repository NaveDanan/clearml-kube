# Local minikube / ArgoCD test values.
#
# Use this from the ArgoCD UI with:
#   Repository URL: https://github.com/NaveDanan/clearml-kube.git
#   Path: clearml-charts
#   Target revision: main
#   Helm values files:
#     - values.yaml
#     - values-testing.yaml
#
# The ClearML images are intentionally local tags. Before syncing in ArgoCD,
# build and load them into the clearml minikube profile. These images use
# imagePullPolicy: Never so Kubernetes will not fall back to docker.io.
#   $env:AIRGAP_IMAGE_TAG = "clearml/clearml:2026-07-25"; docker compose --env-file .env.test -f docker-compose.airgap.yml build
#   docker build -f .\clearml-server\docker\build\runai-worker.Dockerfile --build-arg BASE_IMAGE=clearml/clearml:2026-07-25 -t clearml/runai-worker:2026-07-25 .
#   minikube -p clearml image load clearml/clearml:2026-07-25
#   minikube -p clearml image load clearml/runai-worker:2026-07-25
#
# These values expose fixed Kubernetes NodePorts:
#   web:  30080 -> service port 8080
#   api:  30008 -> service port 8008
#   file: 30081 -> service port 8081
#
# On Docker Desktop / Windows minikube, Kubernetes YAML cannot create local
# localhost port-forwards. If NodePorts are not directly reachable from Windows,
# run these local commands after sync:
#   kubectl port-forward -n clearml-server svc/clearml-server-webserver 8080:8080
#   kubectl port-forward -n clearml-server svc/clearml-server-apiserver 8008:8008
#   kubectl port-forward -n clearml-server svc/clearml-server-fileserver 8081:8081

global:
  imageRegistry: ""

imageCredentials:
  enabled: false

clearml:
  cookieName: clearml-token-k8s
  cookieDomain: ""
  # Use same-origin relative paths so the browser routes API/file calls through
  # the webserver (:8080) nginx proxy. Absolute cross-origin URLs (e.g.
  # http://127.0.0.1:8008) cause the SameSite=Lax auth cookie from auth.login to
  # be dropped by the browser, resulting in "401 missing credentials" after login.
  clientConfigurationApiUrl: "/api"
  clientConfigurationFilesUrl: "/files"

# OIDC SSO login through the oauth2-proxy front door, backed by the Keycloak
# instance deployed by the "keycloak" ArgoCD app (namespace clearml-tools).
# Requires the minikube ingress addon and /etc/hosts entries pointing
# clearml.clearml.local and keycloak.clearml.local at the ingress (127.0.0.1
# when using `minikube tunnel`).
auth:
  mode: "oidc"
  fixedUsers:
    # apiserver.conf fixed users are plaintext test creds (see clearml-auth-secrets).
    passHashed: false
  oidc:
    enabled: true
    displayName: "Keycloak"
    issuerUrl: "http://keycloak.clearml.local/realms/clearml"
    clientId: "clearml"
    scopes: "openid profile email"
    redirectUrl: "http://clearml.clearml.local/oauth2/callback"
    existingSecret: "clearml-oidc"
    sessionBridge:
      enabled: true
      usernameClaim: "email"
      passwordKey: "basic-auth-password"

oauth2Proxy:
  provider: "keycloak-oidc"
  emailDomains: "*"
  # Split-horizon OIDC: the browser hits Keycloak via the ingress hostname while
  # oauth2-proxy redeems tokens / fetches JWKS over in-cluster service DNS. Skip
  # discovery and pin the endpoints so the token issuer stays consistent.
  extraArgs:
    cookie-secure: "false"
    skip-oidc-discovery: "true"
    login-url: "http://keycloak.clearml.local/realms/clearml/protocol/openid-connect/auth"
    redeem-url: "http://keycloak.clearml-tools.svc.cluster.local:8080/realms/clearml/protocol/openid-connect/token"
    oidc-jwks-url: "http://keycloak.clearml-tools.svc.cluster.local:8080/realms/clearml/protocol/openid-connect/certs"
    whitelist-domain: "keycloak.clearml.local"
  ingress:
    enabled: true
    ingressClassName: "nginx"
    hostName: "clearml.clearml.local"
    path: "/"

# Outgoing SMTP routed to the Mailpit test sink deployed by the "mailpit"
# ArgoCD app (namespace clearml-tools). Captured mail is viewable at
# http://mailpit.clearml.local.
email:
  enabled: true
  smtpServer: "mailpit.clearml-tools.svc.cluster.local"
  smtpPort: 1025
  useTls: false
  useSsl: false
  sender: "clearml@clearml.local"
  senderName: "ClearML"

apiserver:
  enabled: true
  # Fixed-users override (auth.fixed_users block) used by the OIDC session
  # bridge. Provided by the clearml-auth-secrets ArgoCD app.
  existingAdditionalConfigsSecret: clearml-fixed-users
  image:
    registry: ""
    repository: "clearml/clearml"
    tag: "2026-07-25"
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30008
  ingress:
    enabled: false
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

fileserver:
  enabled: true
  image:
    registry: ""
    repository: "clearml/clearml"
    tag: "2026-07-25"
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30081
  ingress:
    enabled: false
  storage:
    enabled: true
    data:
      class: standard
      accessMode: ReadWriteOnce
      size: 5Gi
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

webserver:
  enabled: true
  image:
    registry: ""
    repository: "clearml/clearml"
    tag: "2026-07-25"
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30080
  additionalConfigs:
    configuration.json: |
      {
        "apiBaseUrl": "http://127.0.0.1:8008",
        "fileBaseUrl": "http://127.0.0.1:8081",
        "displayedServerUrls": {
          "apiServer": "http://127.0.0.1:8008",
          "filesServer": "http://127.0.0.1:8081"
        }
      }
  ingress:
    enabled: false
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

runaiWorker:
  enabled: true
  image:
    registry: ""
    repository: "clearml/runai-worker"
    tag: "2026-07-25"
    pullPolicy: Never
  replicaCount: 1
  pollInterval: 10
  batchSize: 5
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  master:
    persistence:
      enabled: true
      storageClass: standard
      size: 1Gi

mongodb:
  enabled: true
  persistence:
    enabled: true
    storageClass: standard
    size: 5Gi

elasticsearch:
  enabled: true
  replicas: 1
  image: "docker.elastic.co/elasticsearch/elasticsearch"
  imageTag: "7.17.3"
  imagePullPolicy: IfNotPresent
  esJavaOpts: "-Xmx1g -Xms1g"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  volumeClaimTemplate:
    storageClassName: standard
    resources:
      requests:
        storage: 10Gi
