# Local minikube / ArgoCD test values.
#
# Use this from the ArgoCD UI with:
#   Repository URL: https://github.com/NaveDanan/clearml-kube.git
#   Path: clearml-charts
#   Target revision: main
#   Helm values files:
#     - values.yaml
#     - values-testing.yaml
#
# The ClearML images are intentionally local tags. Before syncing in ArgoCD,
# build and load them into the clearml minikube profile. These images use
# imagePullPolicy: Never so Kubernetes will not fall back to docker.io.
#   $env:AIRGAP_IMAGE_TAG = "clearml/clearml:2026-07-26"; docker compose --env-file .env.test -f docker-compose.airgap.yml build
#   docker build -f .\clearml-server\docker\build\runai-worker.Dockerfile --build-arg BASE_IMAGE=clearml/clearml:2026-07-26 -t clearml/runai-worker:2026-07-26 .
#   minikube -p clearml image load clearml/clearml:2026-07-26
#   minikube -p clearml image load clearml/runai-worker:2026-07-26
#
# These values expose fixed Kubernetes NodePorts:
#   web:  30080 -> service port 8080
#   api:  30008 -> service port 8008
#   file: 30081 -> service port 8081
#
# On Docker Desktop / Windows minikube, Kubernetes YAML cannot create local
# localhost port-forwards. If NodePorts are not directly reachable from Windows,
# run these local commands after sync. The ingress forward is required for OIDC
# because it serves ClearML and Keycloak on the same local port:
#   kubectl port-forward -n ingress-nginx svc/ingress-nginx-controller 8080:80
#   kubectl port-forward -n clearml-server svc/clearml-server-apiserver 8008:8008
#   kubectl port-forward -n clearml-server svc/clearml-server-fileserver 8081:8081

global:
  imageRegistry: ""

imageCredentials:
  enabled: false

clearml:
  cookieName: clearml-token-k8s
  cookieDomain: ""
  # Use same-origin relative paths so the browser routes API/file calls through
  # the webserver (:8080) nginx proxy. Absolute cross-origin URLs (e.g.
  # http://127.0.0.1:8008) cause the SameSite=Lax auth cookie from auth.login to
  # be dropped by the browser, resulting in "401 missing credentials" after login.
  clientConfigurationApiUrl: "/api"
  clientConfigurationFilesUrl: "/files"

# Native OIDC SSO login backed by the Keycloak instance deployed by the
# "keycloak" ArgoCD app (namespace clearml-tools).
# The hostless ClearML ingress supports the familiar http://127.0.0.1:8080
# address, while nip.io gives Keycloak a distinct host on the same ingress.
auth:
  mode: "oidc"
  oidc:
    enabled: true
    displayName: "Keycloak"
    startUrl: "/api/login.oidc_start"
    issuerUrl: "http://keycloak.127.0.0.1.nip.io:8080/realms/clearml"
    clientId: "clearml"
    scopes: "openid profile email"
    redirectUrl: "http://127.0.0.1:8080/api/login.oidc_callback"
    postLogoutRedirectUrl: "http://127.0.0.1:8080/login"
    loginErrorUrl: "http://127.0.0.1:8080/login"
    # The browser uses the public authorization/logout endpoints. Server-side
    # token and JWKS calls use cluster DNS while the validated issuer remains
    # the public realm URL.
    authorizationUrl: "http://keycloak.127.0.0.1.nip.io:8080/realms/clearml/protocol/openid-connect/auth"
    tokenUrl: "http://keycloak.clearml-tools.svc.cluster.local:8080/realms/clearml/protocol/openid-connect/token"
    jwksUrl: "http://keycloak.clearml-tools.svc.cluster.local:8080/realms/clearml/protocol/openid-connect/certs"
    endSessionUrl: "http://keycloak.127.0.0.1.nip.io:8080/realms/clearml/protocol/openid-connect/logout"
    verifyTls: false
    adminGroups:
      - "/clearml-admins"
    # Externally managed; requires only client-secret.
    existingSecret: "clearml-oidc"

# Outgoing SMTP routed to the Mailpit test sink deployed by the "mailpit"
# ArgoCD app (namespace clearml-tools). Captured mail is viewable at
# http://mailpit.127.0.0.1.nip.io.
# SMTP DISABLED for ClearPipe functional validation (test-only). Email delivery
# is not exercised by ClearPipe validation; re-enable later for notification work.
email:
  enabled: false

apiserver:
  enabled: true
  # ClearPipe v2 execution requires a dedicated provenance signing key. Without
  # it the apiserver reports capabilities.execution/run = false and the web
  # "Run" button is disabled (clearpipe.start rejects with
  # provenance_signing_unavailable). These map to
  # secure.clearpipe.provenance_keys.* via the CLEARML__ env override.
  # Provision clearml-provenance externally with a signing-key entry.
  extraEnvs:
    - name: CLEARML__secure__clearpipe__provenance_keys__current_key_id
      value: "current"
    - name: CLEARML__secure__clearpipe__provenance_keys__keys__current
      valueFrom:
        secretKeyRef:
          name: clearml-provenance
          key: signing-key
  image:
    registry: ""
    repository: "clearml/clearml"
    tag: "2026-07-28"
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30008
  ingress:
    enabled: false
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

fileserver:
  enabled: true
  image:
    registry: ""
    repository: "clearml/clearml"
    tag: "2026-07-28"
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30081
  ingress:
    enabled: false
  storage:
    enabled: true
    data:
      class: standard
      accessMode: ReadWriteOnce
      size: 5Gi
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ClearPipe scheduler — fires activated ClearPipe pipelines on their schedule.
# Create clearpipe-scheduler-credentials externally before enabling it.
clearpipeScheduler:
  enabled: true
  image:
    registry: ""
    repository: "clearml/clearpipe-scheduler"
    tag: "2026-07-28"
    pullPolicy: Never
  pollSeconds: 30
  existingSecret: "clearpipe-scheduler-credentials"
  containerSecurityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    # Image USER is the non-numeric name "scheduler" (uid 10001 in the
    # Dockerfile). runAsNonRoot cannot verify a non-numeric user, so pin the
    # numeric uid explicitly or the pod is rejected at admission.
    runAsUser: 10001
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

webserver:
  enabled: true
  image:
    registry: ""
    repository: "clearml/clearml"
    tag: "2026-07-28"
    pullPolicy: Never
  service:
    type: NodePort
    nodePort: 30080
  additionalConfigs:
    configuration.json: |
      {
        "apiBaseUrl": "http://127.0.0.1:8008",
        "fileBaseUrl": "http://127.0.0.1:8081",
        "displayedServerUrls": {
          "apiServer": "http://127.0.0.1:8008",
          "filesServer": "http://127.0.0.1:8081"
        }
      }
  ingress:
    enabled: true
    ingressClassName: "nginx"
    # Empty means a hostless catch-all rule, so 127.0.0.1:8080 works. The
    # Keycloak ingress has a specific host and takes precedence.
    hostName: ""
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

runaiWorker:
  enabled: true
  image:
    registry: ""
    repository: "clearml/runai-worker"
    tag: "2026-07-28"
    pullPolicy: Never
  replicaCount: 1
  pollInterval: 10
  batchSize: 5
  podSecurityContext:
    runAsNonRoot: false
    runAsUser: 0
  containerSecurityContext:
    allowPrivilegeEscalation: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  master:
    persistence:
      enabled: true
      storageClass: standard
      size: 1Gi

mongodb:
  enabled: true
  persistence:
    enabled: true
    storageClass: standard
    size: 5Gi

elasticsearch:
  enabled: true
  replicas: 1
  image: "docker.elastic.co/elasticsearch/elasticsearch"
  imageTag: "7.17.3"
  imagePullPolicy: IfNotPresent
  esJavaOpts: "-Xmx1g -Xms1g"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi
  volumeClaimTemplate:
    storageClassName: standard
    resources:
      requests:
        storage: 10Gi
