{{- if not .Values.clearml.existingSecret }}
{{- fail "clearml.existingSecret is required; pre-provision the ClearML credential Secret before Helm sync" }}
{{- end }}
{{- $oidc := .Values.auth.oidc | default dict }}
{{- $oidcClientAuthenticationMode := $oidc.clientAuthenticationMode | default "confidential" }}
{{- if ne $oidcClientAuthenticationMode "confidential" }}
{{- fail "auth.oidc.clientAuthenticationMode must be 'confidential'; oauth2-proxy requires a confidential Keycloak client secret" }}
{{- end }}
{{- if and .Values.imageCredentials.enabled (not .Values.imageCredentials.existingSecret) }}
{{- fail "imageCredentials.existingSecret is required when imageCredentials.enabled is true" }}
{{- end }}
{{- if and (or (eq .Values.auth.mode "password") (eq .Values.auth.mode "oidc")) (not .Values.auth.fixedUsers.existingSecret) }}
{{- fail "auth.fixedUsers.existingSecret is required when fixed-user authentication is enabled; pre-provision an apiserver.conf Secret" }}
{{- end }}
{{- if and (or (eq .Values.auth.mode "password") (eq .Values.auth.mode "oidc")) (not .Values.apiserver.existingAdditionalConfigsSecret) }}
{{- fail "apiserver.existingAdditionalConfigsSecret is required when fixed-user authentication is enabled; it must name the same apiserver.conf Secret as auth.fixedUsers.existingSecret" }}
{{- end }}
{{- if and (or (eq .Values.auth.mode "password") (eq .Values.auth.mode "oidc")) (ne .Values.auth.fixedUsers.existingSecret .Values.apiserver.existingAdditionalConfigsSecret) }}
{{- fail "auth.fixedUsers.existingSecret and apiserver.existingAdditionalConfigsSecret must name the same Secret" }}
{{- end }}
{{- $email := .Values.email | default dict }}
{{- $emailAuthentication := $email.authentication | default dict }}
{{- $emailAuthenticationEnabled := true }}
{{- if hasKey $emailAuthentication "enabled" }}
{{- $emailAuthenticationEnabled = $emailAuthentication.enabled }}
{{- end }}
{{- if $email.enabled }}
{{- if not $email.smtpServer }}
{{- fail "email.smtpServer is required when email.enabled is true" }}
{{- end }}
{{- $smtpPort := toString $email.smtpPort }}
{{- if or (not (regexMatch "^[0-9]+$" $smtpPort)) (lt (int $smtpPort) 1) (gt (int $smtpPort) 65535) }}
{{- fail "email.smtpPort must be a numeric port between 1 and 65535 when email.enabled is true" }}
{{- end }}
{{- if and $email.useTls $email.useSsl }}
{{- fail "email.useTls and email.useSsl cannot both be true; use STARTTLS or implicit TLS/SSL, not both" }}
{{- end }}
{{- if and $emailAuthenticationEnabled (not $email.existingSecret) }}
{{- fail "email.existingSecret is required when email.enabled and email.authentication.enabled are true; pre-provision SMTP credential keys" }}
{{- end }}
{{- end }}
