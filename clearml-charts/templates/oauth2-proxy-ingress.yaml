{{- /*
Sample front-door ingress for the OIDC flow.

Routes the public host through oauth2-proxy, which serves "/oauth2/*" (start,
callback, sign-in) itself and upstreams every other path to the ClearML
webserver. Enable this only for an "oidc" deployment, and DISABLE
webserver.ingress for the same host so the two do not conflict.
*/ -}}
{{- if and .Values.webserver.enabled
        (eq (.Values.auth | default dict).mode "oidc")
        ((.Values.auth | default dict).oidc | default dict).enabled
        (((.Values.oauth2Proxy | default dict).ingress | default dict).enabled) }}
{{- $ingress := .Values.oauth2Proxy.ingress }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "oauth2proxy.referenceName" . }}
  labels:
    {{- include "clearml.labels" . | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $ingress.ingressClassName }}
  ingressClassName: {{ $ingress.ingressClassName }}
  {{- end }}
  {{- if $ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ $ingress.hostName }}
      secretName: {{ $ingress.tlsSecretName }}
  {{- end }}
  rules:
  - host: {{ $ingress.hostName }}
    http:
      paths:
      - path: {{ $ingress.path | default "/" }}
  {{ if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion }}
        pathType: Prefix
        backend:
          service:
            name: {{ include "oauth2proxy.referenceName" . }}
            port:
              number: {{ .Values.oauth2Proxy.port }}
  {{ else }}
        backend:
          serviceName: {{ include "oauth2proxy.referenceName" . }}
          servicePort: {{ .Values.oauth2Proxy.port }}
  {{ end }}
{{- end }}
