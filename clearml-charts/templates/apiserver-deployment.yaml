{{- if .Values.apiserver.enabled }}
{{- $email := .Values.email | default dict }}
{{- $emailAuthentication := $email.authentication | default dict }}
{{- $emailAuthenticationEnabled := true }}
{{- $oidc := .Values.auth.oidc | default dict }}
{{- if hasKey $emailAuthentication "enabled" }}
{{- $emailAuthenticationEnabled = $emailAuthentication.enabled }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "apiserver.referenceName" . }}
  labels:
    {{- include "clearml.labels" . | nindent 4 }}
{{- with .Values.apiserver.deploymentAnnotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  replicas: {{ .Values.apiserver.replicaCount }}
  selector:
    matchLabels:
      {{- include "apiserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.apiserver.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "apiserver.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.apiserver.serviceAccountName }}-apiserver
      {{- if .Values.imageCredentials.enabled }}
      imagePullSecrets:
      - name: {{ .Values.imageCredentials.existingSecret }}
      {{- end }}
      {{- if or .Values.apiserver.additionalConfigs .Values.apiserver.existingAdditionalConfigsConfigMap .Values.apiserver.existingAdditionalConfigsSecret .Values.apiserver.additionalVolumes (and .Values.runaiWorker.enabled .Values.runaiWorker.caCert.enabled) }}
      volumes:
        {{- if .Values.apiserver.existingAdditionalConfigsConfigMap }}
        - name: apiserver-config
          configMap:
            name: {{ .Values.apiserver.existingAdditionalConfigsConfigMap }}
        {{- else if .Values.apiserver.existingAdditionalConfigsSecret }}
        - name: apiserver-config
          secret:
            secretName: {{ .Values.apiserver.existingAdditionalConfigsSecret }}
        {{- else if .Values.apiserver.additionalConfigs }}
        - name: apiserver-config
         configMap:
            name: "{{ include "apiserver.referenceName" . }}-configmap"
        {{- end }}
        {{- if .Values.apiserver.additionalVolumes }}
        {{- toYaml .Values.apiserver.additionalVolumes | nindent 8 }}
        {{- end }}
        {{- if and .Values.runaiWorker.enabled .Values.runaiWorker.caCert.enabled }}
        - name: runai-ca-source
          secret:
            secretName: {{ .Values.runaiWorker.caCert.existingSecret | default (printf "%s-ca" (include "runaiWorker.referenceName" .)) }}
            items:
              - key: {{ .Values.runaiWorker.caCert.secretKey }}
                path: {{ .Values.runaiWorker.caCert.secretKey }}
        - name: runai-ca-bundle
          emptyDir: {}
        {{- end }}
      {{- end }}
      securityContext:
        {{ toYaml .Values.apiserver.podSecurityContext | nindent 8 }}
      initContainers:
        - name: init-apiserver
          image: "{{ include "registryNamePrefix" (dict "globalValues" .Values.global "imageRegistryValue" .Values.apiserver.image.registry) }}{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag }}"
          command:
            - /bin/sh
            - -c
            - >
              set -x;
              {{- if .Values.elasticsearch.enabled }}
              while [ $(curl -sw '%{http_code}' "http://{{ include "elasticsearch.servicename" . }}:{{ include "elasticsearch.serviceport" . }}/_cluster/health" -o /dev/null) -ne 200 ] ; do
                echo "waiting for elasticsearch" ;
                sleep 5 ;
              done ;
              {{- end }}
              {{- if .Values.mongodb.enabled }}
              while [ $(curl --telnet-option BOGUS --connect-timeout 2 -s "telnet://{{ .Release.Name }}-{{ include "mongodb.hostname" . }}:27017" -o /dev/null; echo $?) -ne 49 ] ; do
                echo "waiting for mongodb" ;
                sleep 5 ;
              done ;
              {{- end }}
              {{- if .Values.redis.enabled }}
              while [ $(curl --telnet-option BOGUS --connect-timeout 2 -s "telnet://{{ include "redis.servicename" . }}:{{ include "redis.serviceport" . }}" -o /dev/null; echo $?) -ne 49 ] ; do
                echo "waiting for redis" ;
                sleep 5 ;
              done ;
              {{- end }}
              {{- if and .Values.runaiWorker.enabled .Values.runaiWorker.caCert.enabled }}
              echo "building combined Run:ai CA trust bundle for REST API requests" ;
              cat /etc/ssl/certs/ca-certificates.crt /runai-ca-src/* > /runai-ca/ca-bundle.crt ;
              {{- end }}
          securityContext:
            {{ toYaml .Values.apiserver.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.apiserver.initContainers.resources | nindent 12 }}
          {{- if and .Values.runaiWorker.enabled .Values.runaiWorker.caCert.enabled }}
          volumeMounts:
            - name: runai-ca-source
              mountPath: /runai-ca-src
              readOnly: true
            - name: runai-ca-bundle
              mountPath: /runai-ca
          {{- end }}
      containers:
        - name: clearml-apiserver
          image: "{{ include "registryNamePrefix" (dict "globalValues" .Values.global "imageRegistryValue" .Values.apiserver.image.registry) }}{{ .Values.apiserver.image.repository }}:{{ .Values.apiserver.image.tag }}"
          imagePullPolicy: {{ .Values.apiserver.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8008
              protocol: TCP
          env:
          - name: CLEARML__HOSTS__ELASTIC__WORKERS__HOSTS
            value: {{ include "elasticsearch.connectionstring" . }}
          - name: CLEARML__HOSTS__ELASTIC__EVENTS__HOSTS
            value: {{ include "elasticsearch.connectionstring" . }}
          - name: CLEARML__HOSTS__ELASTIC__DATASETS__HOSTS
            value: {{ include "elasticsearch.connectionstring" . }}
          - name: CLEARML__HOSTS__ELASTIC__LOGS__HOSTS
            value: {{ include "elasticsearch.connectionstring" . }}
          {{- if .Values.mongodb.enabled }}
          - name: CLEARML_MONGODB_SERVICE_CONNECTION_STRING
            value: {{ include "mongodb.connectionstring" . | quote }}
          {{- else }}
          - name: CLEARML__HOSTS__MONGO__BACKEND__HOST
            value: {{ .Values.externalServices.mongodbConnectionStringBackend | quote }}
          - name: CLEARML__HOSTS__MONGO__AUTH__HOST
            value: {{ .Values.externalServices.mongodbConnectionStringAuth | quote }}
          {{- end }}
          - name: CLEARML_REDIS_SERVICE_HOST
            value: {{ include "redis.servicename" . }}
          - name: CLEARML_REDIS_SERVICE_PORT
            value: "{{ include "redis.serviceport" . }}"
          - name: CLEARML_CONFIG_PATH
            value: /opt/clearml/config
          - name: CLEARML__apiserver__default_company_name
            value: "{{ .Values.clearml.defaultCompany }}"
          - name: CLEARML__APISERVER__AUTH__SESSION_AUTH_COOKIE_NAME
            value: {{ .Values.clearml.cookieName }}
          - name: CLEARML__APISERVER__AUTH__COOKIES__SECURE
            value: {{ .Values.clearml.cookieSecure | quote }}
          {{- if .Values.clearml.cookieDomain }}
          - name: CLEARML__APISERVER__AUTH__COOKIES__DOMAIN
            value: ".{{ .Values.clearml.cookieDomain }}"
          {{- end }}
          {{- if eq .Values.auth.mode "password" }}
          # Enable fixed-user (username/password) authentication. The actual user
          # list is supplied via apiserver.existingAdditionalConfigsSecret
          # (an apiserver.conf carrying the auth.fixed_users.users block).
          - name: CLEARML__apiserver__auth__fixed_users__enabled
            value: "true"
          - name: CLEARML__apiserver__auth__fixed_users__pass_hashed
            value: {{ .Values.auth.fixedUsers.passHashed | quote }}
          {{- end }}
          {{- if and (eq .Values.auth.mode "oidc") $oidc.enabled }}
          # Native authorization-code OIDC login. The API validates signed ID
          # tokens and provisions stable identities by issuer + subject.
          - name: CLEARML__APISERVER__AUTH__OIDC__ENABLED
            value: "true"
          - name: CLEARML__APISERVER__AUTH__OIDC__ISSUER_URL
            value: {{ $oidc.issuerUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__CLIENT_ID
            value: {{ $oidc.clientId | toJson | quote }}
          - name: CLEARML_OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ $oidc.existingSecret }}
                key: client-secret
          - name: CLEARML__APISERVER__AUTH__OIDC__CLIENT_AUTHENTICATION_METHOD
            value: {{ $oidc.clientAuthenticationMethod | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__REDIRECT_URL
            value: {{ $oidc.redirectUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__SCOPES
            value: {{ $oidc.scopes | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__DISPLAY_NAME
            value: {{ $oidc.displayName | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__START_URL
            value: {{ $oidc.startUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__AUTHORIZATION_URL
            value: {{ $oidc.authorizationUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__TOKEN_URL
            value: {{ $oidc.tokenUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__JWKS_URL
            value: {{ $oidc.jwksUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__END_SESSION_URL
            value: {{ $oidc.endSessionUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__POST_LOGOUT_REDIRECT_URL
            value: {{ $oidc.postLogoutRedirectUrl | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__LOGIN_ERROR_URL
            value: {{ ($oidc.loginErrorUrl | default $oidc.postLogoutRedirectUrl) | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__VERIFY_TLS
            value: {{ $oidc.verifyTls | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__HTTP_TIMEOUT_SEC
            value: {{ $oidc.httpTimeoutSec | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__STATE_TTL_SEC
            value: {{ $oidc.stateTtlSec | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__ALLOWED_ALGORITHMS
            value: {{ $oidc.allowedAlgorithms | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__EMAIL_CLAIM
            value: {{ $oidc.emailClaim | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__NAME_CLAIM
            value: {{ $oidc.nameClaim | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__GIVEN_NAME_CLAIM
            value: {{ $oidc.givenNameClaim | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__FAMILY_NAME_CLAIM
            value: {{ $oidc.familyNameClaim | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__GROUPS_CLAIM
            value: {{ $oidc.groupsClaim | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__REQUIRE_VERIFIED_EMAIL
            value: {{ $oidc.requireVerifiedEmail | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__ALLOWED_GROUPS
            value: {{ $oidc.allowedGroups | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__ADMIN_GROUPS
            value: {{ $oidc.adminGroups | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__DEFAULT_ROLE
            value: {{ $oidc.defaultRole | toJson | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__SYNC_ROLES
            value: {{ $oidc.syncRoles | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__SYNC_PROFILE
            value: {{ $oidc.syncProfile | quote }}
          - name: CLEARML__APISERVER__AUTH__OIDC__LINK_EXISTING_USERS_BY_EMAIL
            value: {{ $oidc.linkExistingUsersByEmail | quote }}
          {{- end }}
          {{- if $email.enabled }}
          # Outgoing SMTP for user notifications (task/pipeline/dataset/report done).
          - name: CLEARML__apiserver__email__enabled
            value: "true"
          # Free-text values are wrapped in HOCON quotes (double `quote`) so the
          # apiserver env-config parser accepts characters like '@' and spaces
          # (e.g. an email sender address). Without this the apiserver crashes on
          # startup with a pyhocon ParseException.
          - name: CLEARML__apiserver__email__smtp_server
            value: {{ $email.smtpServer | quote | quote }}
          - name: CLEARML__apiserver__email__smtp_port
            value: {{ $email.smtpPort | quote }}
          - name: CLEARML__apiserver__email__use_tls
            value: {{ $email.useTls | quote }}
          - name: CLEARML__apiserver__email__use_ssl
            value: {{ $email.useSsl | quote }}
          - name: CLEARML__apiserver__email__sender
            value: {{ $email.sender | quote | quote }}
          - name: CLEARML__apiserver__email__sender_name
            value: {{ $email.senderName | quote | quote }}
          {{- if $emailAuthenticationEnabled }}
          - name: CLEARML__apiserver__email__username
            valueFrom:
              secretKeyRef:
                name: {{ $email.existingSecret }}
                key: smtp-username
          - name: CLEARML__apiserver__email__password
            valueFrom:
              secretKeyRef:
                name: {{ $email.existingSecret }}
                key: smtp-password
          {{- end }}
          {{- end }}
          - name: CLEARML__secure__credentials__apiserver__user_key
            valueFrom:
              secretKeyRef:
                name: {{ include "clearml.confSecretName" .}}
                key: apiserver_key
          - name: CLEARML__secure__credentials__apiserver__user_secret
            valueFrom:
              secretKeyRef:
                name: {{ include "clearml.confSecretName" .}}
                key: apiserver_secret
          - name: CLEARML__secure__auth__token_secret
            valueFrom:
              secretKeyRef:
                name: {{ include "clearml.confSecretName" .}}
                key: secure_auth_token_secret
          - name: CLEARML_READINESSPROBE_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "clearml.confSecretName" .}}
                key: readinessprobe_key
          - name: CLEARML_READINESSPROBE_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ include "clearml.confSecretName" .}}
                key: readinessprobe_secret
          {{- if .Values.apiserver.prepopulateEnabled }}
          - name: CLEARML__APISERVER__PRE_POPULATE__ENABLED
            value: "true"
          - name: CLEARML__APISERVER__PRE_POPULATE__ZIP_FILES
            value: "/opt/clearml/db-pre-populate"
          {{- end }}
          - name: CLEARML__SECURE__CREDENTIALS__TESTS__USER_KEY
            valueFrom:
              secretKeyRef:
                name: {{ include "clearml.confSecretName" .}}
                key: test_user_key
          - name: CLEARML__SECURE__CREDENTIALS__TESTS__USER_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ include "clearml.confSecretName" .}}
                key: test_user_secret
          - name: CLEARML_ENV
            value: "helm-cloud"
          {{- if and .Values.runaiWorker.enabled .Values.runaiWorker.caCert.enabled }}
          - name: SSL_CERT_FILE
            value: /runai-ca/ca-bundle.crt
          - name: REQUESTS_CA_BUNDLE
            value: /runai-ca/ca-bundle.crt
          - name: CURL_CA_BUNDLE
            value: /runai-ca/ca-bundle.crt
          {{- end }}
          {{- if .Values.apiserver.extraEnvs }}
          {{ toYaml .Values.apiserver.extraEnvs | nindent 10 }}
          {{- end }}
          args:
            - apiserver
          livenessProbe:
            initialDelaySeconds: 60
            httpGet:
              path: /debug.ping
              port: 8008
          readinessProbe:
            initialDelaySeconds: 60
            failureThreshold: 8
            exec:
              command:
                - sh
                - -ec
                - 'curl --fail --silent --show-error --user "$CLEARML_READINESSPROBE_KEY:$CLEARML_READINESSPROBE_SECRET" http://localhost:8008/debug.ping'
          {{- if or .Values.apiserver.additionalConfigs .Values.apiserver.existingAdditionalConfigsConfigMap  .Values.apiserver.existingAdditionalConfigsSecret .Values.apiserver.additionalVolumeMounts (and .Values.runaiWorker.enabled .Values.runaiWorker.caCert.enabled) }}
          volumeMounts:  
            {{- if or .Values.apiserver.additionalConfigs .Values.apiserver.existingAdditionalConfigsConfigMap  .Values.apiserver.existingAdditionalConfigsSecret }}
            - name: apiserver-config
              mountPath: /opt/clearml/config
            {{- end }}
            {{- if .Values.apiserver.additionalVolumeMounts }}
            {{- toYaml .Values.apiserver.additionalVolumeMounts | nindent 12 }}
            {{- end }}
            {{- if and .Values.runaiWorker.enabled .Values.runaiWorker.caCert.enabled }}
            - name: runai-ca-bundle
              mountPath: /runai-ca
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.apiserver.resources | nindent 12 }}
          securityContext:
            {{ toYaml .Values.apiserver.containerSecurityContext | nindent 12 }}
      {{- with .Values.apiserver.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiserver.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
