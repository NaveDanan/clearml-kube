# -- Global parameters section
global:
  # -- Images registry
  imageRegistry: "docker.io"

# -- Container registry configuration
imageCredentials:
  # -- Use a pre-provisioned image-pull Secret when private images are required.
  enabled: false
  # -- Required when enabled. The Secret must be type kubernetes.io/dockerconfigjson.
  existingSecret: ""

# -- ClearMl generic configurations
clearml:
  # -- Name fo the UI cookie
  cookieName: "clearml-token-k8s"
  # -- Cookie domain to be left empty if not exposed with an ingress
  cookieDomain: ""
  # -- Mark authentication cookies Secure. Enable for every HTTPS deployment.
  cookieSecure: false
  # -- Company name
  defaultCompany: "d1bd92a3b039400cbafc60a7a5b1e52b"
  # -- Name of a pre-provisioned ClearML credential Secret. It must contain:
  #    apiserver_key, apiserver_secret, fileserver_key, fileserver_secret,
  #    readinessprobe_key, readinessprobe_secret, secure_auth_token_secret,
  #    test_user_key, and test_user_secret.
  # -- Override the API Urls displayed when showing an example of the SDK's clearml.conf configuration
  clientConfigurationApiUrl: ""
  # -- Override the Files Urls displayed when showing an example of the SDK's clearml.conf configuration
  clientConfigurationFilesUrl: ""
  existingSecret: "clearml-conf"

# -- Authentication / login configuration
auth:
  # -- Login mode surfaced to users. One of:
  #   "name-only" : default ClearML flow, any typed full name is accepted (no password).
  #   "password"  : fixed-user username/password login (enables apiserver fixed_users).
  #   "oidc"      : native OIDC authorization-code login. The API validates the
  #                 ID token, provisions the user, and issues a ClearML session.
  mode: "name-only"
  # -- Fixed users used by "password" mode.
  fixedUsers:
    # -- Whether the supplied passwords are base64(bcrypt) hashes. Strongly recommended.
    passHashed: true
    # -- Name of an existing Secret that contains an "apiserver.conf" key with the
    #    full `auth { fixed_users { ... users: [...] } }` block. This is the
    #    recommended way to provide credentials so they never live in values.
    #    When set, also set apiserver.existingAdditionalConfigsSecret to the same Secret.
    existingSecret: ""
  # -- OIDC / SSO configuration (used when mode == "oidc").
  oidc:
    # -- Master switch for native OIDC login.
    enabled: false
    # -- Human-readable provider name shown on the login button ("Log in with <displayName>").
    displayName: "Keycloak"
    # -- Optional ClearML icon class rendered on the SSO button.
    icon: "al-ico-lock"
    # -- Browser entrypoint that starts the server-side OIDC flow.
    startUrl: "/api/login.oidc_start"
    # -- Keycloak/OIDC issuer (e.g. https://keycloak.example.com/realms/clearml).
    issuerUrl: ""
    # -- Confidential OIDC client registered for the ClearML API.
    clientId: "clearml"
    # -- Client authentication at the token endpoint: client_secret_post or
    #    client_secret_basic.
    clientAuthenticationMethod: "client_secret_post"
    # -- Requested OIDC scopes.
    scopes: "openid profile email"
    # -- Public redirect/callback URL registered in Keycloak
    #    (e.g. https://clearml.example.com/api/login.oidc_callback).
    redirectUrl: ""
    # -- Browser destination after provider logout.
    postLogoutRedirectUrl: ""
    # -- Browser destination for a failed login. The API appends oidc_error.
    loginErrorUrl: ""
    # -- Optional split-horizon endpoint overrides. Leave empty to use discovery.
    authorizationUrl: ""
    tokenUrl: ""
    jwksUrl: ""
    endSessionUrl: ""
    # -- Verify TLS for discovery, token, and JWKS HTTP requests.
    verifyTls: true
    httpTimeoutSec: 10
    stateTtlSec: 600
    # -- Only signed ID tokens using these algorithms are accepted.
    allowedAlgorithms:
      - "RS256"
    # -- Name of an externally managed Secret containing client-secret.
    existingSecret: ""
    # -- Claim and authorization mapping.
    emailClaim: "email"
    nameClaim: "name"
    givenNameClaim: "given_name"
    familyNameClaim: "family_name"
    groupsClaim: "groups"
    requireVerifiedEmail: true
    # -- Empty allows any identity accepted by the configured provider.
    allowedGroups: []
    # -- Members of any listed group receive the ClearML admin role.
    adminGroups: []
    defaultRole: "user"
    syncRoles: true
    syncProfile: true
    # -- Link a pre-existing ClearML account only when its verified email exactly
    #    matches. Disabled by default to prevent accidental account takeover.
    linkExistingUsersByEmail: false

# -- Outgoing email (SMTP) for user notifications (task/pipeline/dataset/report done).
#    Wires the apiserver.email.* config. Disabled by default.
email:
  # -- Master switch. When true, the apiserver can send notification emails.
  enabled: false
  authentication:
    # -- Enable SMTP username/password authentication. Set false for an
    #    unauthenticated relay; existingSecret is then not required or referenced.
    enabled: true
  # -- SMTP relay host.
  smtpServer: ""
  # -- SMTP relay port (587 for STARTTLS, 465 for implicit SSL).
  smtpPort: 587
  # -- Use STARTTLS (typically with port 587). Cannot be enabled with useSsl.
  useTls: true
  # -- Use implicit TLS/SSL (typically with port 465). Cannot be enabled with useTls.
  useSsl: false
  # -- From address on outgoing mail.
  sender: "clearml@localhost"
  # -- From display name on outgoing mail.
  senderName: "ClearML"
  # -- Name of an existing Secret containing `smtp-username` and `smtp-password`.
  #    Required only when email.authentication.enabled is true.
  existingSecret: ""

# -- Api Server configurations
apiserver:
  # -- Enable/Disable component deployment
  enabled: true
  # -- Add the provided map to the annotations for the Deployment resource created by this chart.
  deploymentAnnotations:
  # -- Enable/Disable example data load
  prepopulateEnabled: true
  # -- The default serviceAccountName to be used
  serviceAccountName: clearml
  # -- Add the provided map to the annotations for the ServiceAccount resource created by this chart.
  serviceAccountAnnotations: {}
  # -- Api Server image configuration
  image:
    registry: ""
    repository: "allegroai/clearml"
    pullPolicy: IfNotPresent
    tag: "2.0.0-613"
  # -- Api Server internal service configuration
  service:
    # -- specific annotation for Api Server service
    annotations: {}
    type: NodePort
    port: 8008
    # -- If service.type set to NodePort, this will be set to service's nodePort field.
    # If service.type is set to others, this field will be ignored
    nodePort: 30008
  # -- Api Server number of pods
  replicaCount: 1
  # -- Api Server resources per initContainers pod
  initContainers:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 10m
        memory: 64Mi
  # -- Ingress configuration for Api Server component
  ingress:
    # -- Enable/Disable ingress
    enabled: false
    # -- ClassName (must be defined if no default ingressClassName is available)
    ingressClassName: ""
    # -- Ingress hostname domain
    hostName: "api.clearml.127-0-0-1.nip.io"
    # -- Reference to secret containing TLS certificate. If set, it enables HTTPS on ingress rule.
    tlsSecretName: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress root path url
    path: "/"
  # -- Api Server internal processes configuration
  processes:
    # -- Api Server internal listing processes
    count: 8
    # -- Api timeout (ms)
    timeout: 24000
    # -- Api Server maximum number of concurrent requests
    maxRequests: 1000
    # -- Api Server max jitter on api request
    maxRequestsJitter: 300
  # -- Api Server extra envrinoment variables
  extraEnvs: []
  # -- specific annotation for Api Server pods
  podAnnotations: {}
  # -- Api Server resources per pod; these are minimal requirements, it's suggested to increase
  # these values in production environments
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  # -- Api Server nodeselector
  nodeSelector: {}
  # -- Api Server tolerations setup
  tolerations: []
  # -- Api Server affinity setup
  affinity: {}
  # -- Api Server pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # -- Api Server containers security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
  #   runAsUser: 1001
  #   fsGroup: 1001
  # -- reference for files declared in existing ConfigMap will be mounted and read by apiserver (examples in values.yaml)
  existingAdditionalConfigsConfigMap: ""
  # -- reference for files declared in existing Secret will be mounted and read by apiserver (examples in values.yaml) if not overridden by existingAdditionalConfigsConfigMap
  existingAdditionalConfigsSecret: ""
  # -- files declared in this parameter will be mounted and read by apiserver (examples in values.yaml) if not overridden by existingAdditionalConfigsSecret
  additionalConfigs: {}
  #   services.conf: |
  #     tasks {
  #       non_responsive_tasks_watchdog {
  #         # In-progress tasks that haven't been updated for at least 'value' seconds will be stopped by the watchdog
  #         threshold_sec: 21000
  #         # Watchdog will sleep for this number of seconds after each cycle
  #         watch_interval_sec: 900
  #       }
  #     }
  #   apiserver.conf: |
  #     auth {
  #       fixed_users {
  #         enabled: true
  #         pass_hashed: false
  #         users: [
  #           {
  #             username: "jane"
  #             name: "Jane Doe"
  #           },
  #           {
  #             username: "john"
  #             name: "John Doe"
  #           },
  #         ]
  #       }
  #     }
  # -- # Defines extra Kubernetes volumes to be attached to the pod.
  additionalVolumes: {}
  #  - name: ramdisk
  #    emptyDir:
  #      medium: Memory
  #      sizeLimit: 32Gi
  # -- Specifies where and how the volumes defined in additionalVolumes.
  additionalVolumeMounts: {}
  #  - mountPath: /dev/shm
  #    name: ramdisk

# -- ClearPipe scheduler: a standalone worker that fires activated ClearPipe
# pipelines according to their scheduler node. It talks to the apiserver over the
# public API using a dedicated credentials pair.
# NOTE: this Deployment runs a FIXED single replica (not configurable). Duplicate-run
# protection relies on one replica + the server-derived last-fired marker; there is
# no distributed lock or schedule-slot dedup yet, so running multiple replicas is
# UNSUPPORTED and will cause double fires.
clearpipeScheduler:
  # -- Enable/Disable the ClearPipe scheduler deployment
  enabled: false
  # -- Scheduler image configuration
  image:
    registry: ""
    repository: "clearpipe-scheduler"
    pullPolicy: IfNotPresent
    tag: "latest"
  # -- Poll interval in seconds between schedule evaluations
  pollSeconds: 30
  # -- Log level (DEBUG/INFO/WARNING/ERROR)
  logLevel: "INFO"
  # -- apiserver base URL. Defaults to the in-cluster apiserver service when empty.
  apiHost: ""
  # -- Required when enabled. Pre-provision this Secret with `access_key` and
  #    `secret_key`; Helm never creates or stores scheduler credentials.
  existingSecret: "clearpipe-scheduler-credentials"
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod-level security context
  podSecurityContext: {}
  # -- Container-level security context
  containerSecurityContext: {}
  # -- Scheduler resource requests/limits
  resources: {}
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity
  affinity: {}

# -- File Server configurations
fileserver:
  # -- Enable/Disable component deployment
  enabled: true
  # -- Add the provided map to the annotations for the Deployment resource created by this chart.
  deploymentAnnotations: {}
  # -- The default serviceAccountName to be used
  serviceAccountName: clearml
  # -- Add the provided map to the annotations for the ServiceAccount resource created by this chart.
  serviceAccountAnnotations: {}
  # -- File Server image configuration
  image:
    registry: ""
    repository: "allegroai/clearml"
    pullPolicy: IfNotPresent
    tag: "2.0.0-613"
  # -- File Server internal service configuration
  service:
    # -- specific annotation for File Server service
    annotations: {}
    type: NodePort
    port: 8081
    # -- If service.type set to NodePort, this will be set to service's nodePort field.
    # If service.type is set to others, this field will be ignored
    nodePort: 30081
  # -- File Server number of pods
  replicaCount: 1
  # -- File Server resources per initContainers pod
  initContainers:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 10m
        memory: 64Mi
  # -- Ingress configuration for File Server component
  ingress:
    # -- Enable/Disable ingress
    enabled: false
    # -- ClassName (must be defined if no default ingressClassName is available)
    ingressClassName: ""
    # -- Ingress hostname domain
    hostName: "files.clearml.127-0-0-1.nip.io"
    # -- Reference to secret containing TLS certificate. If set, it enables HTTPS on ingress rule.
    tlsSecretName: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress root path url
    path: "/"
  # -- File Server extra envrinoment variables
  extraEnvs: []
  # -- specific annotation for File Server pods
  podAnnotations: {}
  # -- File Server resources per pod; these are minimal requirements, it's suggested to increase
  # these values in production environments
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  # -- File Server nodeselector
  nodeSelector: {}
  # -- File Server tolerations setup
  tolerations: []
  # -- File Server affinity setup
  affinity: {}
  # -- File Server pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # -- File Server containers security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
  #   runAsUser: 1001
  #   fsGroup: 1001
  # -- File server persistence settings
  storage:
    # -- If set to false no PVC is created and emptyDir is used
    enabled: true
    data:
      # -- If set, it uses an already existing PVC instead of dynamic provisioning
      existingPVC: ""
      # -- Storage class (use default if empty)
      class: ""
      # -- Access mode (must be ReadWriteMany if fileserver replica > 1)
      accessMode: ReadWriteOnce
      size: 50Gi
  # -- # Defines extra Kubernetes volumes to be attached to the pod.
  additionalVolumes: {}
  #  - name: ramdisk
  #    emptyDir:
  #      medium: Memory
  #      sizeLimit: 32Gi
  # -- Specifies where and how the volumes defined in additionalVolumes.
  additionalVolumeMounts: {}
  #  - mountPath: /dev/shm
  #    name: ramdisk

