# -- Run:ai worker configurations
runaiWorker:
  # -- Enable/Disable Run:ai worker deployment
  enabled: false
  # -- Add the provided map to the annotations for the Deployment resource created by this chart.
  deploymentAnnotations: {}
  # -- The default serviceAccountName to be used
  serviceAccountName: clearml
  # -- Add the provided map to the annotations for the ServiceAccount resource created by this chart.
  serviceAccountAnnotations: {}
  # -- Run:ai worker image configuration
  image:
    registry: ""
    repository: "runai-worker"
    pullPolicy: IfNotPresent
    tag: "2026-06-03"
  # -- Run:ai worker number of pods. Keep at 1 unless execution claiming is proven under concurrency.
  replicaCount: 1
  # -- Run:ai worker poll interval in seconds
  pollInterval: 10
  # -- Maximum pending executions claimed per poll
  batchSize: 5
  # -- Run:ai worker initContainer resources
  initContainers:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 10m
        memory: 64Mi
  # -- Run:ai worker extra environment variables
  extraEnvs: []
  # -- Private/company CA certificate(s) to trust for Run:ai control-plane and
  #    OpenShift TLS. Needed when the cluster uses a certificate signed by an
  #    internal CA (otherwise `runai login` fails with "x509: certificate signed
  #    by unknown authority"). The CA is merged with the system trust bundle by
  #    init containers and exposed to the Go-based runai/oc CLIs and the
  #    apiserver's Python REST client via SSL_CERT_FILE / REQUESTS_CA_BUNDLE,
  #    so neither container needs to run as root.
  caCert:
    # -- Enable mounting and trusting a custom CA bundle
    enabled: false
    # -- Inline PEM bundle (one or more certificates). Ignored when existingSecret is set.
    content: ""
    # -- Use an existing secret that already contains the CA bundle instead of `content`
    existingSecret: ""
    # -- Key inside the secret (existing or generated) that holds the PEM bundle
    secretKey: "company-ca.crt"
  # -- specific annotation for Run:ai worker pods
  podAnnotations: {}
  # -- Run:ai worker resources per pod
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # -- Run:ai worker nodeselector
  nodeSelector: {}
  # -- Run:ai worker tolerations setup
  tolerations: []
  # -- Run:ai worker affinity setup
  affinity: {}
  # -- Run:ai worker pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # -- Run:ai worker containers security context
  containerSecurityContext:
    allowPrivilegeEscalation: false

# -- Definition of external services to use if not enabled as dependency charts here
externalServices:
  # -- Existing ElasticSearch connectionstring if elasticsearch.enabled is false (example in values.yaml)
  elasticsearchConnectionString: "[{\"host\":\"es_hostname1\",\"port\":9200},{\"host\":\"es_hostname2\",\"port\":9200},{\"host\":\"es_hostname3\",\"port\":9200}]"
  # -- Existing MongoDB connection string for BACKEND to use if mongodb.enabled is false (example in values.yaml)
  mongodbConnectionStringAuth: "mongodb://mongodb_hostname:27017/auth"
  # -- Existing MongoDB connection string for AUTH to use if mongodb.enabled is false (example in values.yaml)
  mongodbConnectionStringBackend: "mongodb://mongodb_hostnamehostname:27017/backend"
  # -- Existing Redis Hostname to use if redis.enabled is false (example in values.yaml)
  redisHost: "redis_hostname"
  # -- Existing Redis Port to use if redis.enabled is false
  redisPort: 6379

# -- Configuration from https://github.com/bitnami/charts/blob/master/bitnami/redis/values.yaml
redis:
  enabled: true
  auth:
    enabled: false
  databaseNumber: 0
  master:
    name: "{{ .Release.Name }}-redis-master"
    port: 6379
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 5Gi
      ## If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner
      storageClass: null
  architecture: standalone

# -- Configuration from https://github.com/bitnami/charts/blob/master/bitnami/mongodb/values.yaml
mongodb:
  enabled: true
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  architecture: standalone
  auth:
    enabled: false
  replicaCount: 1
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    ## If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner
    storageClass: null

# -- Configuration from https://github.com/elastic/helm-charts/blob/7.16/elasticsearch/values.yaml
elasticsearch:
  enabled: true
  httpPort: 9200
  roles:
    master: "true"
    ingest: "true"
    data: "true"
    remote_cluster_client: "true"
  replicas: 1
  # Readiness probe hack for a single-node cluster (where status will never be green). Should be removed if using replicas > 1
  clusterHealthCheckParams: "wait_for_status=yellow&timeout=1s"
  rbac:
    create: true
  minimumMasterNodes: 1
  clusterName: clearml-elastic
  esJavaOpts: "-Xmx2g -Xms2g"
  extraEnvs:
    - name: bootstrap.memory_lock
      value: "false"
    - name: cluster.routing.allocation.node_initial_primaries_recoveries
      value: "500"
    - name: cluster.routing.allocation.disk.watermark.low
      value: 500mb
    - name: cluster.routing.allocation.disk.watermark.high
      value: 500mb
    - name: cluster.routing.allocation.disk.watermark.flood_stage
      value: 500mb
    - name: http.compression_level
      value: "7"
    - name: reindex.remote.whitelist
      value: '*.*'
    - name: xpack.monitoring.enabled
      value: "false"
    - name: xpack.security.enabled
      value: "false"
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  persistence:
    enabled: true
  volumeClaimTemplate:
    accessModes: ["ReadWriteOnce"]
    ## If undefined (the default) or set to null, no storageClassName spec is set, choosing the default provisioner
    storageClassName: null
    resources:
      requests:
        storage: 50Gi
  esConfig:
    elasticsearch.yml: |
      xpack.security.enabled: false
