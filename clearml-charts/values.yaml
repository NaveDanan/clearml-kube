# -- Global parameters section
global:
  # -- Images registry
  imageRegistry: "docker.io"

# -- Container registry configuration
imageCredentials:
  # -- Use private authentication mode
  enabled: false
  # -- If this is set, chart will not generate a secret but will use what is defined here
  existingSecret: ""
  # -- Registry name
  registry: docker.io
  # -- Registry username
  username: someone
  # -- Registry password
  password: pwd
  # -- Email
  email: someone@host.com

# -- ClearMl generic configurations
clearml:
  # -- Name fo the UI cookie
  cookieName: "clearml-token-k8s"
  # -- Cookie domain to be left empty if not exposed with an ingress
  cookieDomain: ""
  # -- Company name
  defaultCompany: "d1bd92a3b039400cbafc60a7a5b1e52b"
  # -- Api Server basic auth key
  apiserverKey: GGS9F4M6XB2DXJ5AFT9F
  # -- Api Server basic auth secret
  apiserverSecret: 2oGujVFhPfaozhpuz2GzQfA5OyxmMsR3WVJpsCR5hrgHFs20PO
  # -- File Server basic auth key
  fileserverKey: XXCRJ123CEE2KSQ068WO
  # -- File Server basic auth secret
  fileserverSecret: YIy8EVAC7QCT4FtgitxAQGyW7xRHDZ4jpYlTE7HKiscpORl1hG
  # -- Readiness probe basic auth key
  readinessprobeKey: GK4PRTVT3706T25K6BA1
  # -- Readiness probe basic auth secret
  readinessprobeSecret: ymLh1ok5k5xNUQfS944Xdx9xjf0wueokqKM2dMZfHuH9ayItG2
  # -- Secure Auth secret
  secureAuthTokenSecret: ymLh1ok5k5xNUQfS944Xdx9xjf0wueokqKM2dMZfHuH9ayItG2
  # -- Test Server basic auth key
  testUserKey: "ENP39EQM4SLACGD5FXB7"
  # -- Test File Server basic auth secret
  testUserSecret: "lPcm0imbcBZ8mwgO7tpadutiS3gnJD05x9j7afwXPS35IKbpiQ"
  # -- Override the API Urls displayed when showing an example of the SDK's clearml.conf configuration
  clientConfigurationApiUrl: ""
  # -- Override the Files Urls displayed when showing an example of the SDK's clearml.conf configuration
  clientConfigurationFilesUrl: ""
  # -- Pass Clearml secrets using an existing secret
  # must contain the keys: apiserver_key, apiserver_secret, secure_auth_token_secret, test_user_key, test_user_secret
  existingSecret: ""

# -- Authentication / login configuration
auth:
  # -- Login mode surfaced to users. One of:
  #   "name-only" : default ClearML flow, any typed full name is accepted (no password).
  #   "password"  : fixed-user username/password login (enables apiserver fixed_users).
  #   "oidc"      : password login PLUS an "Log in with <provider>" SSO button,
  #                 with the OIDC flow handled by the oauth2-proxy front door.
  mode: "name-only"
  # -- Fixed users used by "password" and "oidc" modes.
  fixedUsers:
    # -- Whether the supplied passwords are base64(bcrypt) hashes. Strongly recommended.
    passHashed: true
    # -- Name of an existing Secret that contains an "apiserver.conf" key with the
    #    full `auth { fixed_users { ... users: [...] } }` block. This is the
    #    recommended way to provide credentials so they never live in values.
    #    When set, also set apiserver.existingAdditionalConfigsSecret to the same Secret.
    existingSecret: ""
  # -- OIDC / SSO configuration (used when mode == "oidc").
  oidc:
    # -- Master switch for surfacing the SSO button and deploying oauth2-proxy.
    enabled: false
    # -- Human-readable provider name shown on the login button ("Log in with <displayName>").
    displayName: "Keycloak"
    # -- Optional ClearML icon class rendered on the SSO button.
    icon: "al-ico-lock"
    # -- Browser entrypoint that starts the OIDC flow. For the bundled oauth2-proxy
    #    front door this is the proxy sign-in path.
    startUrl: "/oauth2/start"
    # -- Keycloak/OIDC issuer (e.g. https://keycloak.example.com/realms/clearml).
    issuerUrl: ""
    # -- OIDC client id registered in Keycloak for ClearML.
    clientId: "clearml"
    # -- Requested OIDC scopes.
    scopes: "openid profile email"
    # -- Public redirect/callback URL registered in Keycloak
    #    (e.g. https://clearml.example.com/oauth2/callback).
    redirectUrl: ""
    # -- Name of an existing Secret holding the OIDC client secret and the
    #    oauth2-proxy cookie secret. Expected keys:
    #      client-secret : the Keycloak client secret
    #      cookie-secret : a 32-byte base64/hex random string for oauth2-proxy
    #      basic-auth-password : (only when sessionBridge.enabled) shared password
    #                            that mapped ClearML fixed users must also use
    existingSecret: ""
    # -- Session bridge: how the verified SSO identity becomes a real ClearML
    #    session. Open-source ClearML will not mint a session from an external
    #    identity on its own, so oauth2-proxy injects an HTTP Basic Authorization
    #    header (user + shared password) to the ClearML upstream. ClearML's
    #    fixed-user auth then accepts the request and issues its own session.
    #
    #    Requirements:
    #      * oauth2Proxy.ingress must be the front door (all app traffic flows
    #        through the proxy) -- see oauth2Proxy.ingress below.
    #      * A ClearML fixed user must exist for each SSO user, with
    #        username == the value sent by oauth2-proxy (email or preferred
    #        username) and password == the shared basic-auth-password.
    #      * Non-browser clients (SDK/agents) cannot do OIDC; route them around
    #        the proxy or authenticate them with ClearML credentials directly.
    sessionBridge:
      # -- Enable the Basic-auth bridge described above.
      enabled: true
      # -- Claim used as the Basic auth username sent upstream:
      #    "email" (adds --prefer-email-to-user) or "user" (preferred_username).
      usernameClaim: "email"
      # -- Key in auth.oidc.existingSecret holding the shared Basic auth password.
      passwordKey: "basic-auth-password"

# -- OIDC reverse-proxy front door (oauth2-proxy). Only deployed when auth.oidc.enabled.
oauth2Proxy:
  image:
    registry: "quay.io"
    repository: "oauth2-proxy/oauth2-proxy"
    tag: "v7.6.0"
    pullPolicy: IfNotPresent
  # -- oauth2-proxy provider. "keycloak-oidc" targets a Keycloak realm.
  provider: "keycloak-oidc"
  # -- Service port exposed by oauth2-proxy.
  port: 4180
  replicaCount: 1
  # -- Upstream that oauth2-proxy proxies authenticated requests to.
  #    Defaults to the in-cluster ClearML webserver service.
  upstream: ""
  # -- Comma-separated email domains permitted to sign in ("*" allows all).
  emailDomains: "*"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # -- Extra raw args passed to oauth2-proxy for advanced/edge configuration.
  extraArgs: {}
  # -- Sample ingress that makes oauth2-proxy the front door for the whole app.
  #    When enabled, DISABLE webserver.ingress for the same host: the proxy
  #    upstreams to the ClearML webserver and serves "/oauth2/*" itself, so the
  #    SSO button (startUrl "/oauth2/start") and the OIDC callback both resolve.
  ingress:
    # -- Enable the oauth2-proxy front-door ingress.
    enabled: false
    # -- Ingress class (e.g. "nginx").
    ingressClassName: ""
    # -- Public hostname users browse to (must match auth.oidc.redirectUrl host).
    hostName: "clearml.example.com"
    # -- Root path routed through the proxy.
    path: "/"
    # -- TLS secret for the host. Strongly recommended (SSO over plain HTTP is unsafe).
    tlsSecretName: ""
    # -- Extra ingress annotations.
    annotations: {}

# -- Outgoing email (SMTP) for user notifications (task/pipeline/dataset/report done).
#    Wires the apiserver.email.* config. Disabled by default.
email:
  # -- Master switch. When true, the apiserver can send notification emails.
  enabled: false
  # -- SMTP relay host.
  smtpServer: ""
  # -- SMTP relay port (587 for STARTTLS, 465 for implicit SSL).
  smtpPort: 587
  # -- Use STARTTLS (typically with port 587).
  useTls: true
  # -- Use implicit SSL (typically with port 465).
  useSsl: false
  # -- From address on outgoing mail.
  sender: "clearml@localhost"
  # -- From display name on outgoing mail.
  senderName: "ClearML"
  # -- SMTP auth username (leave empty for unauthenticated relays).
  username: ""
  # -- Name of an existing Secret holding the SMTP password under key "smtp-password".
  #    Preferred over inlining the password below.
  existingSecret: ""
  # -- Inline SMTP password (NOT recommended; use existingSecret for real deployments).
  password: ""

# -- Api Server configurations
apiserver:
  # -- Enable/Disable component deployment
  enabled: true
  # -- Add the provided map to the annotations for the Deployment resource created by this chart.
  deploymentAnnotations:
  # -- Enable/Disable example data load
  prepopulateEnabled: true
  # -- The default serviceAccountName to be used
  serviceAccountName: clearml
  # -- Add the provided map to the annotations for the ServiceAccount resource created by this chart.
  serviceAccountAnnotations: {}
  # -- Api Server image configuration
  image:
    registry: ""
    repository: "allegroai/clearml"
    pullPolicy: IfNotPresent
    tag: "2.0.0-613"
  # -- Api Server internal service configuration
  service:
    # -- specific annotation for Api Server service
    annotations: {}
    type: NodePort
    port: 8008
    # -- If service.type set to NodePort, this will be set to service's nodePort field.
    # If service.type is set to others, this field will be ignored
    nodePort: 30008
  # -- Api Server number of pods
  replicaCount: 1
  # -- Api Server resources per initContainers pod
  initContainers:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 10m
        memory: 64Mi
  # -- Ingress configuration for Api Server component
  ingress:
    # -- Enable/Disable ingress
    enabled: false
    # -- ClassName (must be defined if no default ingressClassName is available)
    ingressClassName: ""
    # -- Ingress hostname domain
    hostName: "api.clearml.127-0-0-1.nip.io"
    # -- Reference to secret containing TLS certificate. If set, it enables HTTPS on ingress rule.
    tlsSecretName: ""
    # -- Ingress annotations
    annotations: {}
    # -- Ingress root path url
    path: "/"
  # -- Api Server internal processes configuration
  processes:
    # -- Api Server internal listing processes
    count: 8
    # -- Api timeout (ms)
    timeout: 24000
    # -- Api Server maximum number of concurrent requests
    maxRequests: 1000
    # -- Api Server max jitter on api request
    maxRequestsJitter: 300
  # -- Api Server extra envrinoment variables
  extraEnvs: []
  # -- specific annotation for Api Server pods
  podAnnotations: {}
  # -- Api Server resources per pod; these are minimal requirements, it's suggested to increase
  # these values in production environments
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  # -- Api Server nodeselector
  nodeSelector: {}
  # -- Api Server tolerations setup
  tolerations: []
  # -- Api Server affinity setup
  affinity: {}
  # -- Api Server pod security context
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  # -- Api Server containers security context
  containerSecurityContext:
    allowPrivilegeEscalation: false
  #   runAsUser: 1001
  #   fsGroup: 1001
  # -- reference for files declared in existing ConfigMap will be mounted and read by apiserver (examples in values.yaml)
  existingAdditionalConfigsConfigMap: ""
  # -- reference for files declared in existing Secret will be mounted and read by apiserver (examples in values.yaml) if not overridden by existingAdditionalConfigsConfigMap
  existingAdditionalConfigsSecret: ""
  # -- files declared in this parameter will be mounted and read by apiserver (examples in values.yaml) if not overridden by existingAdditionalConfigsSecret
  additionalConfigs: {}
  #   services.conf: |
  #     tasks {
  #       non_responsive_tasks_watchdog {
  #         # In-progress tasks that haven't been updated for at least 'value' seconds will be stopped by the watchdog
  #         threshold_sec: 21000
  #         # Watchdog will sleep for this number of seconds after each cycle
  #         watch_interval_sec: 900
  #       }
  #     }
  #   apiserver.conf: |
  #     auth {
  #       fixed_users {
  #         enabled: true
  #         pass_hashed: false
  #         users: [
  #           {
  #             username: "jane"
  #             password: "12345678"
  #             name: "Jane Doe"
  #           },
  #           {
  #             username: "john"
  #             password: "12345678"
  #             name: "John Doe"
  #           },
  #         ]
  #       }
  #     }
  # -- # Defines extra Kubernetes volumes to be attached to the pod.
  additionalVolumes: {}
  #  - name: ramdisk
  #    emptyDir:
  #      medium: Memory
  #      sizeLimit: 32Gi
  # -- Specifies where and how the volumes defined in additionalVolumes.
  additionalVolumeMounts: {}
  #  - mountPath: /dev/shm
  #    name: ramdisk

# -- ClearPipe scheduler: a standalone worker that fires activated ClearPipe
# pipelines according to their scheduler node. It talks to the apiserver over the
# public API using a dedicated credentials pair.
# NOTE: this Deployment runs a FIXED single replica (not configurable). Duplicate-run
# protection relies on one replica + the server-derived last-fired marker; there is
# no distributed lock or schedule-slot dedup yet, so running multiple replicas is
# UNSUPPORTED and will cause double fires.
clearpipeScheduler:
  # -- Enable/Disable the ClearPipe scheduler deployment
  enabled: false
  # -- Scheduler image configuration
  image:
    registry: ""
    repository: "clearpipe-scheduler"
    pullPolicy: IfNotPresent
    tag: "latest"
  # -- Poll interval in seconds between schedule evaluations
  pollSeconds: 30
  # -- Log level (DEBUG/INFO/WARNING/ERROR)
  logLevel: "INFO"
  # -- apiserver base URL. Defaults to the in-cluster apiserver service when empty.
  apiHost: ""
  # -- Name of an existing secret with keys `access_key` and `secret_key`.
  # When empty, a secret is created from apiCredentials below.
  existingSecret: ""
  # -- ClearML App Credentials used to authenticate to the apiserver.
  # Generate them in the web UI (Settings -> Workspace -> App Credentials).
  apiCredentials:
    accessKey: ""
    secretKey: ""
  # -- Pod annotations
  podAnnotations: {}
  # -- Pod-level security context
  podSecurityContext: {}
  # -- Container-level security context
  containerSecurityContext: {}
  # -- Scheduler resource requests/limits
  resources: {}
  # -- Node selector
  nodeSelector: {}
  # -- Tolerations
  tolerations: []
  # -- Affinity
  affinity: {}

