apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  namespace: clearml-tools
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: clearml-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: clearml-tools
    spec:
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.20.6
          imagePullPolicy: IfNotPresent
          env:
            # Accept mail from any (unauthenticated) sender - this is a test sink.
            - name: MP_SMTP_AUTH_ACCEPT_ANY
              value: "true"
            - name: MP_SMTP_AUTH_ALLOW_INSECURE
              value: "true"
          ports:
            - name: smtp
              containerPort: 1025
              protocol: TCP
            - name: http
              containerPort: 8025
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: clearml-tools
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: clearml-tools
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
      protocol: TCP
    - name: http
      port: 8025
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  namespace: clearml-tools
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: clearml-tools
spec:
  ingressClassName: nginx
  rules:
    - host: mailpit.clearml.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  number: 8025
