apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-clearml
  namespace: clearml-tools
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: clearml-tools
data:
  # Imported on start-dev. The client secret is resolved from the required
  # CLEARML_OIDC_CLIENT_SECRET environment variable; no users are seeded.
  clearml-realm.json: |
    {
      "realm": "clearml",
      "enabled": true,
      "sslRequired": "none",
      "loginTheme": "keycloak",
      "smtpServer": {
        "host": "mailpit.clearml-tools.svc.cluster.local",
        "port": "1025",
        "from": "keycloak@clearml.local",
        "fromDisplayName": "Keycloak",
        "ssl": "false",
        "starttls": "false",
        "auth": "false"
      },
      "clients": [
        {
          "clientId": "clearml",
          "name": "ClearML",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "secret": "${CLEARML_OIDC_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": true,
          "redirectUris": [
            "http://clearml.127.0.0.1.nip.io/oauth2/callback"
          ],
          "webOrigins": [
            "http://clearml.127.0.0.1.nip.io"
          ],
          "protocolMappers": [
            {
              "name": "clearml-audience",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "clearml",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ]
    }
