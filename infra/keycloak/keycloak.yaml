apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: clearml-tools
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: clearml-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: clearml-tools
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0.6
          imagePullPolicy: IfNotPresent
          args:
            - start-dev
            - --import-realm
          env:
            # Bootstrap admin (console login at http://keycloak.clearml.local, admin/admin).
            - name: KEYCLOAK_ADMIN
              value: "admin"
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: "admin"
            # Serve plain HTTP behind the nginx ingress.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            # Fixed public issuer so the token "iss" is stable regardless of the
            # in-cluster service DNS oauth2-proxy uses for token/jwks calls.
            - name: KC_HOSTNAME
              value: "http://keycloak.clearml.local"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            # Allow backchannel (token/jwks) requests via any host (service DNS).
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /realms/master
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-clearml
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: clearml-tools
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: clearml-tools
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: clearml-tools
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: clearml-tools
spec:
  ingressClassName: nginx
  rules:
    - host: keycloak.clearml.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
