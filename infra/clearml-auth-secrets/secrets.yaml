# Test-only secrets for the ClearML OIDC SSO bridge and SMTP notifications.
# These live in the clearml-server namespace (same as the apiserver and the
# oauth2-proxy front door) and are referenced by clearml-charts/values-testing.yaml.
#
# NOTE: values here are local-test placeholders. Do not reuse in production.
apiVersion: v1
kind: Secret
metadata:
  name: clearml-oidc
  namespace: clearml-server
  labels:
    app.kubernetes.io/part-of: clearml-server
type: Opaque
stringData:
  # Must match the Keycloak "clearml" client secret (infra/keycloak realm import).
  client-secret: "clearml-oidc-secret"
  # oauth2-proxy cookie signing secret (must be 16, 24 or 32 bytes).
  cookie-secret: "0123456789abcdef0123456789abcdef"
  # Shared password the session bridge injects as HTTP Basic auth to ClearML.
  # Must equal the fixed-user password below so ClearML accepts the SSO request.
  basic-auth-password: "clearml-sso-bridge"
---
# ClearML fixed-users override consumed via apiserver.existingAdditionalConfigsSecret.
# Mounted at /opt/clearml/config/apiserver.conf. The username MUST equal the SSO
# email claim and the password MUST equal clearml-oidc/basic-auth-password.
apiVersion: v1
kind: Secret
metadata:
  name: clearml-fixed-users
  namespace: clearml-server
  labels:
    app.kubernetes.io/part-of: clearml-server
type: Opaque
stringData:
  apiserver.conf: |
    auth {
        fixed_users {
            enabled: true
            pass_hashed: false
            users: [
                {
                    username: "tester@clearml.local"
                    password: "clearml-sso-bridge"
                    name: "Test User"
                }
            ]
        }
    }
