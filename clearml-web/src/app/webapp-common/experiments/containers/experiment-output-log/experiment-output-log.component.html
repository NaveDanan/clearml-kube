@if (hasLog() && showHeader()) {
  <div class="header">
    <div class="console-context">
      <span class="live-indicator" aria-hidden="true"></span>
      <div class="console-copy">
        <span class="console-title">Console output</span>
        <span class="hostname ellipsis" [smTooltip]="creator()" matTooltipShowDelay="300" smShowTooltipIfEllipsis>
          Host: {{creator()}}
        </span>
      </div>
    </div>
    <div class="console-actions">
      <div class="refresh-rate-wrap">
        @if (subSecondRefresh()) {
          <div class="refresh-warning" role="status">
            <mat-icon fontSet="al" fontIcon="al-ico-alert"></mat-icon>
            <span>Sub-second polling — heavy server/ES load; for local testing only</span>
          </div>
        }
        <mat-form-field appearance="outline" class="refresh-rate no-bottom" smTooltip="Console refresh rate" matTooltipShowDelay="300">
          <mat-icon matPrefix fontSet="al" fontIcon="al-ico-refresh"></mat-icon>
          <mat-select [value]="logRefreshInterval()" (selectionChange)="changeRefreshInterval($event.value)"
            panelClass="refresh-rate-panel" aria-label="Console refresh rate">
            @for (opt of refreshOptions; track opt.value) {
              <mat-option [value]="opt.value">{{opt.label}}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
      <button mat-stroked-button (click)="downloadLog()">
        <mat-icon fontSet="al" fontIcon="al-ico-download"></mat-icon>
        <span class="download-label">Download full log</span>
      </button>
      <mat-form-field appearance="outline" class="log-search no-bottom">
        <mat-icon matPrefix fontSet="al" fontIcon="al-ico-search"></mat-icon>
        <input
          matInput
          aria-label="Filter console output by regular expression"
          placeholder="Filter logs (regex)"
          [value]="filter$ | ngrxPush"
          (keyup)="filterLog($event)"
        />
      </mat-form-field>
    </div>
  </div>
}
@if (hasLog() === false) {
  <div class="no-output">
    <mat-icon fontSet="al" fontIcon="al-ico-log" class="xxl"></mat-icon>
    <h4>NO LOG DATA</h4>
  </div>
}

@if (hasLog()) {
  <sm-experiment-log-info
    [class.no-header]="!showHeader()"
    [logs]="log()"
    [beginningOfLog]="logBeginning$ | ngrxPush"
    [filterString]="filter$ | ngrxPush"
    [fetching]="fetching$ | ngrxPush"
    (fetchMore)="getLogs($event)"
    (scrolledToBottom)="this.scrolledToBottom.emit();"
  ></sm-experiment-log-info>
}
