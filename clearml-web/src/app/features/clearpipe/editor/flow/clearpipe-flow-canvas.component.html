<div class="cp-flow-canvas"
     #canvas
     [class.cp-flow-canvas--panning]="panning()"
     [style]="backgroundStyle()"
     (pointerdown)="onCanvasPointerDown($event)"
     (wheel)="onWheel($event)"
     (dragover)="onDragOver($event)"
     (drop)="onDrop($event)">

  <div class="cp-flow-world" [style.transform]="worldTransform()">
    @for (boundary of boundaries(); track trackBoundary($index, boundary)) {
      <div class="cp-flow-boundary"
           [class.cp-flow-boundary--selected]="selectedBoundaryId() === boundary.id"
           [style.left.px]="boundary.position.x"
           [style.top.px]="boundary.position.y"
           [style.width.px]="boundary.width"
           [style.height.px]="boundary.height"
           (pointerdown)="onBoundaryPointerDown($event, boundary)">
        <svg class="cp-flow-boundary__outline" [attr.width]="boundary.width" [attr.height]="boundary.height">
          <rect x="1" y="1" [attr.width]="boundary.width - 2" [attr.height]="boundary.height - 2" rx="11" ry="11"></rect>
        </svg>
        <div class="cp-flow-boundary__bar">
          <mat-icon class="cp-flow-boundary__grip" fontSet="al" fontIcon="al-ico-frame-rule"></mat-icon>
          <input class="cp-flow-boundary__label"
                 [ngModel]="boundary.label"
                 (ngModelChange)="setBoundaryLabel(boundary, $event)"
                 (pointerdown)="$event.stopPropagation()"
                 placeholder="Boundary" />
          <button mat-icon-button type="button" class="cp-flow-boundary__delete"
                  title="Delete boundary"
                  (pointerdown)="$event.stopPropagation()" (click)="removeBoundary($event, boundary)">
            <mat-icon fontSet="al" fontIcon="al-ico-trash"></mat-icon>
          </button>
        </div>
        <span class="cp-flow-boundary__resize" title="Resize"
              (pointerdown)="onBoundaryResizePointerDown($event, boundary)"></span>
      </div>
    }

    <svg class="cp-flow-edges" [attr.overflow]="'visible'">
      <defs>
        <marker id="cp-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--cp-accent-edge, #7c8598)"></path>
        </marker>
      </defs>

      @for (edge of edgeViews(); track trackEdge($index, edge)) {
        <g class="cp-flow-edge" (contextmenu)="removeEdge($event, edge.id)">
          <path class="cp-flow-edge__hit" [attr.d]="edge.path"></path>
          <path class="cp-flow-edge__line" [attr.d]="edge.path" marker-end="url(#cp-flow-arrow)"></path>
        </g>
      }

      @if (pendingPath(); as path) {
        <path class="cp-flow-edge__pending" [attr.d]="path"></path>
      }
    </svg>

    @for (node of nodes(); track trackNode($index, node)) {
      <div class="cp-flow-node"
           [class.cp-flow-node--selected]="selectedNodeId() === node.id"
           [class.cp-flow-node--in-boundary]="containedNodeIds().has(node.id)"
           [style.--accent]="meta(node.type).accent"
           [style.left.px]="node.position.x"
           [style.top.px]="node.position.y"
           [attr.data-node-id]="node.id"
           (pointerdown)="onNodePointerDown($event, node)">

        <span class="cp-flow-handle cp-flow-handle--in" [attr.data-node-id]="node.id" title="Input"></span>

        <div class="cp-flow-node__header">
          <span class="cp-flow-node__icon">
            <mat-icon fontSet="al" [fontIcon]="meta(node.type).icon"></mat-icon>
          </span>
          <div class="cp-flow-node__titles">
            <span class="cp-flow-node__label">{{ node.label }}</span>
            <span class="cp-flow-node__desc">{{ node.description }}</span>
          </div>
          <span class="cp-flow-node__status"
                [style.background]="statusColors[node.status]"
                [title]="node.statusMessage || node.status"></span>
        </div>

        <div class="cp-flow-node__footer">
          <span class="cp-flow-node__badge">{{ badgeLabel(node) }}</span>
          <div class="cp-flow-node__actions">
            <button mat-icon-button type="button" class="cp-flow-node__action"
                    title="Configure" (pointerdown)="$event.stopPropagation()" (click)="configure($event, node)">
              <mat-icon fontSet="al" fontIcon="al-ico-configuration"></mat-icon>
            </button>
            <button mat-icon-button type="button" class="cp-flow-node__action"
                    title="Duplicate" (pointerdown)="$event.stopPropagation()" (click)="duplicate($event, node)">
              <mat-icon fontSet="al" fontIcon="al-ico-clone"></mat-icon>
            </button>
            <button mat-icon-button type="button" class="cp-flow-node__action cp-flow-node__action--danger"
                    title="Delete" (pointerdown)="$event.stopPropagation()" (click)="remove($event, node)">
              <mat-icon fontSet="al" fontIcon="al-ico-trash"></mat-icon>
            </button>
          </div>
        </div>

        <span class="cp-flow-handle cp-flow-handle--out"
              [attr.data-node-id]="node.id"
              title="Drag to connect"
              (pointerdown)="onOutputPointerDown($event, node)"></span>
      </div>
    }
  </div>

  <div class="cp-flow-controls">
    <button mat-icon-button type="button" title="Zoom in" (pointerdown)="$event.stopPropagation()" (click)="zoomBy(1.2)">
      <mat-icon fontSet="al" fontIcon="al-ico-plus"></mat-icon>
    </button>
    <button mat-icon-button type="button" title="Zoom out" (pointerdown)="$event.stopPropagation()" (click)="zoomBy(0.8)">
      <mat-icon fontSet="al" fontIcon="al-ico-minus"></mat-icon>
    </button>
    <button mat-icon-button type="button" title="Fit" aria-label="Fit canvas" (pointerdown)="$event.stopPropagation()" (click)="fitView()">
      <mat-icon fontSet="al" fontIcon="al-ico-crop"></mat-icon>
    </button>
  </div>
</div>
