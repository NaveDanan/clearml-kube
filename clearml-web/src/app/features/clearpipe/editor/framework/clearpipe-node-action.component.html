<span class="clearpipe-node-action">
  <button type="button"
          [disabled]="action().disabled"
          [attr.aria-describedby]="action().disabledReason ? reasonId() : null"
          (click)="invoke()">
    @if (action().icon) { <mat-icon aria-hidden="true" fontSet="al" [fontIcon]="action().icon"></mat-icon> }
    {{ action().label }}
  </button>
  @if (action().disabledReason) {
    <small [id]="reasonId()"><mat-icon aria-hidden="true" fontSet="al" fontIcon="al-ico-info-circle-outline"></mat-icon>{{ action().disabledReason }}</small>
  }
</span>
