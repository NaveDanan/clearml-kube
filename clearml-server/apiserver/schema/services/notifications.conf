_description: "Manage user notification subscriptions (e.g. email when a task/pipeline/dataset/report finishes)."

_default {
    internal: false
    allow_roles: ["*"]
}

subscribe {
    "2.31" {
        description: "Subscribe the calling user to notifications for an entity"
        request {
            type: object
            required: [ entity_type, entity ]
            properties {
                entity_type {
                    description: "Entity type: task, pipeline, dataset or report"
                    type: string
                }
                entity {
                    description: "Entity id to subscribe to"
                    type: string
                }
                events {
                    description: "Events/statuses to be notified about. Defaults to terminal task statuses."
                    type: array
                    items { type: string }
                }
            }
        }
        response {
            type: object
            properties {
                id {
                    description: "Subscription id"
                    type: string
                }
            }
        }
    }
}

unsubscribe {
    "2.31" {
        description: "Remove the calling user's subscription for an entity"
        request {
            type: object
            required: [ entity_type, entity ]
            properties {
                entity_type {
                    description: "Entity type"
                    type: string
                }
                entity {
                    description: "Entity id"
                    type: string
                }
            }
        }
        response {
            type: object
            properties {
                deleted {
                    description: "Number of subscriptions removed (0 or 1)"
                    type: integer
                }
            }
        }
    }
}

get_subscriptions {
    "2.31" {
        description: "List the calling user's notification subscriptions"
        request {
            type: object
            additionalProperties: false
            properties {
                entity_type {
                    description: "Optional filter by entity type"
                    type: string
                }
                entity {
                    description: "Optional filter by entity id"
                    type: string
                }
            }
        }
        response {
            type: object
            properties {
                subscriptions {
                    description: "The list of subscriptions"
                    type: array
                    items {
                        type: object
                        additionalProperties: true
                    }
                }
            }
        }
    }
}
