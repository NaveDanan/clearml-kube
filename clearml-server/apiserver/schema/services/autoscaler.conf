_description: """This service provides autoscaler settings and workload management for external orchestration providers (e.g. Run:ai)"""
_default {
    internal: true
}

_definitions {
    include "_common.conf"
    runai_settings {
        type: object
        description: "Run:ai connection settings"
        properties {
            connection_method {
                description: "Connection method: openshift or runai_application"
                type: string
            }
            openshift_login_mode {
                description: "OpenShift login input mode: fields or command"
                type: string
            }
            openshift_api_url {
                description: "OpenShift API URL"
                type: string
            }
            openshift_token {
                description: "OpenShift authentication token"
                type: string
            }
            openshift_login_command {
                description: "Full oc login command containing server URL and token"
                type: string
            }
            runai_cp_url {
                description: "Run:ai control plane base URL; REST authentication appends /api/v1/token"
                type: string
            }
            runai_access_key {
                description: "Run:ai application access key/name for non-interactive login"
                type: string
            }
            runai_secret_key {
                description: "Run:ai application secret key"
                type: string
            }
            runai_cluster {
                description: "Run:ai cluster name"
                type: string
            }
            runai_project {
                description: "Run:ai project name"
                type: string
            }
            runai_cli_version {
                description: "Run:ai CLI command set: auto, v1, or v2"
                type: string
            }
            workload_logs_method {
                description: "Workload log retrieval method: api or cli"
                type: string
            }
            user {
                description: "ClearML user that saved the Run:ai connection"
                type: string
            }
            worker {
                description: "ClearML worker/runai_worker associated with the saved connection"
                type: string
            }
        }
    }
    workload_request {
        type: object
        description: "Workload submission request"
        properties {
            workload_type {
                description: "Type of workload: training, workspace, or inference"
                type: string
            }
            workload_name {
                description: "Name of the workload"
                type: string
            }
            project {
                description: "Run:ai project override"
                type: string
            }
            image {
                description: "Container image"
                type: string
            }
            command {
                description: "Container command"
                type: string
            }
            args {
                description: "Arguments passed after --"
                type: string
            }
            environment_variables {
                description: "Comma-separated KEY=VALUE pairs"
                type: string
            }
            template {
                description: "Run:ai template name"
                type: string
            }
            compute {
                description: "Selected Run:ai compute resource asset name"
                type: string
            }
            environment {
                description: "Selected Run:ai environment asset name"
                type: string
            }
            data_sources {
                description: "Comma-separated selected Run:ai data source asset names"
                type: string
            }
            cpu_core_request {
                description: "CPU core request"
                type: string
            }
            cpu_core_limit {
                description: "CPU core limit"
                type: string
            }
            cpu_memory_request {
                description: "CPU memory request"
                type: string
            }
            cpu_memory_limit {
                description: "CPU memory limit"
                type: string
            }
            gpu_devices_request {
                description: "Number of GPU devices"
                type: string
            }
            gpu_memory_request {
                description: "GPU memory request"
                type: string
            }
            gpu_portion_request {
                description: "GPU portion request"
                type: string
            }
            gpu_request_type {
                description: "GPU request type"
                type: string
            }
            node_pools {
                description: "Comma-separated node pool names"
                type: string
            }
            node_type {
                description: "Node type"
                type: string
            }
            priority {
                description: "Scheduling priority"
                type: string
            }
            preemptibility {
                description: "Preemptibility setting"
                type: string
            }
            run_as_uid {
                description: "User ID the workload container runs as"
                type: string
            }
            run_as_gid {
                description: "Group ID the workload container runs as"
                type: string
            }
            supplemental_groups {
                description: "Comma-separated supplemental group IDs"
                type: string
            }
            existing_pvc {
                description: "Existing PVC spec"
                type: string
            }
            working_dir {
                description: "Working directory"
                type: string
            }
            large_shm {
                description: "Whether to request a large shared-memory device"
                type: boolean
            }
            parallelism {
                description: "Training parallelism"
                type: string
            }
            runs {
                description: "Number of training runs"
                type: string
            }
            restart_policy {
                description: "Restart policy"
                type: string
            }
            backoff_limit {
                description: "Backoff limit"
                type: string
            }
            external_url {
                description: "External URL spec"
                type: string
            }
            serving_port {
                description: "Inference serving port"
                type: string
            }
            min_replicas {
                description: "Minimum replicas for inference"
                type: string
            }
            max_replicas {
                description: "Maximum replicas for inference"
                type: string
            }
            initial_replicas {
                description: "Initial replicas for inference"
                type: string
            }
            metric {
                description: "Autoscaling metric"
                type: string
            }
            metric_threshold {
                description: "Metric threshold value"
                type: string
            }
            scale_to_zero_retention {
                description: "Scale-to-zero retention in seconds"
                type: string
            }
        }
    }
    execution_result {
        type: object
        description: "Workload execution result"
        properties {
            status {
                description: "Execution status: queued, pending, running, success, or error"
                type: string
            }
            stdout {
                description: "Standard output from CLI"
                type: string
            }
            stderr {
                description: "Standard error from CLI"
                type: string
            }
            return_code {
                description: "CLI process return code when available"
                type: string
            }
            timestamp {
                description: "ISO timestamp of execution"
                type: string
            }
            execution_id {
                description: "Unique execution identifier"
                type: string
            }
            projects_count {
                description: "Number of Run:ai projects available to a connection test"
                type: integer
            }
            result_data {
                description: "Structured result payload for read operations (dashboard/project resources)"
                type: object
                additionalProperties: true
            }
        }
    }
    dashboard_data {
        type: object
        description: "Live Run:ai dashboard status"
        properties {
            connected {
                description: "Whether live Run:ai data was refreshed successfully"
                type: boolean
            }
            error {
                description: "Error message if refresh failed"
                type: string
            }
            refreshing {
                description: "Whether a live refresh has been queued on the runai_worker"
                type: boolean
            }
            execution_id {
                description: "Execution id of the queued dashboard refresh to poll via get_execution"
                type: string
            }
            timestamp {
                description: "ISO timestamp of the refresh"
                type: string
            }
            idle_instances {
                description: "Number of idle/stopped/suspended workloads"
                type: number
            }
            running_instances {
                description: "Number of running workloads"
                type: number
            }
            pending_instances {
                description: "Number of pending or queued workloads"
                type: number
            }
            failed_instances {
                description: "Number of failed workloads"
                type: number
            }
            total_instances {
                description: "Total number of workloads visible to the configured Run:ai project"
                type: number
            }
            status_counts {
                description: "Workload counts by Run:ai status"
                type: object
            }
            resources {
                description: "Cluster and project resource summary"
                type: object
            }
            queues {
                description: "Run:ai projects/queues summary"
                type: array
                items {
                    type: object
                }
            }
            instances {
                description: "Run:ai workload instances"
                type: array
                items {
                    type: object
                }
            }
            saved_instances {
                description: "Autoscaler app instances saved in ClearML"
                type: array
                items {
                    type: object
                }
            }
            console_log {
                description: "Recent Run:ai CLI refresh log lines"
                type: array
                items {
                    type: object
                }
            }
        }
    }
    project_resources {
        type: object
        description: "Run:ai assets available for a project"
        properties {
            connected {
                description: "Whether the Run:ai asset lookup succeeded"
                type: boolean
            }
            error {
                description: "Error message if the lookup failed"
                type: string
            }
            refreshing {
                description: "Whether an asset refresh has been queued on the runai_worker"
                type: boolean
            }
            execution_id {
                description: "Execution id of the queued asset lookup to poll via get_execution"
                type: string
            }
            project {
                description: "Project the assets were resolved for"
                type: string
            }
            projects {
                description: "Names of the available Run:ai projects"
                type: array
                items {
                    type: string
                }
            }
            compute {
                description: "Available compute resource assets"
                type: array
                items {
                    type: object
                }
            }
            environments {
                description: "Available environment assets"
                type: array
                items {
                    type: object
                }
            }
            data_sources {
                description: "Available data source assets"
                type: array
                items {
                    type: object
                }
            }
            console_log {
                description: "Recent Run:ai CLI lookup log lines"
                type: array
                items {
                    type: object
                }
            }
        }
    }
    workload_logs {
        type: object
        description: "Console log lines for a single Run:ai workload / app instance"
        properties {
            connected {
                description: "Whether the workload logs were retrieved successfully"
                type: boolean
            }
            error {
                description: "Error message if the log retrieval failed"
                type: string
            }
            refreshing {
                description: "Whether a log refresh has been queued on the runai_worker"
                type: boolean
            }
            execution_id {
                description: "Execution id of the queued log refresh to poll via get_execution"
                type: string
            }
            workload_name {
                description: "Name of the workload the logs belong to"
                type: string
            }
            project {
                description: "Run:ai project containing the workload"
                type: string
            }
            source {
                description: "Where the logs were read from: runai or openshift"
                type: string
            }
            timestamp {
                description: "ISO timestamp of the log refresh"
                type: string
            }
            lines {
                description: "Console log lines for the workload"
                type: array
                items {
                    type: string
                }
            }
            console_log {
                description: "Recent Run:ai/oc CLI log retrieval lines"
                type: array
                items {
                    type: object
                }
            }
        }
    }
}

get_settings {
    "2.31" {
        description: "Get autoscaler settings for the company"
        request {
            type: object
            properties {}
        }
        response {
            type: object
            properties {
                settings {
                    description: "Current autoscaler settings"
                    "$ref": "#/_definitions/runai_settings"
                }
            }
        }
    }
}

set_settings {
    "2.31" {
        description: "Set autoscaler connection settings"
        request {
            "$ref": "#/_definitions/runai_settings"
        }
        response {
            type: object
            properties {
                updated {
                    description: "Number of updated records"
                    type: integer
                }
            }
        }
    }
}

reset_settings {
    "2.31" {
        description: "Reset autoscaler settings to defaults"
        request {
            type: object
            properties {}
        }
        response {
            type: object
            properties {
                updated {
                    description: "Number of updated records"
                    type: integer
                }
            }
        }
    }
}

test_connection {
    "2.31" {
        description: "Queue a connection test for the stored Run:ai settings"
        request {
            type: object
            properties {}
        }
        response {
            "$ref": "#/_definitions/execution_result"
        }
    }
}

get_command_templates {
    "2.31" {
        description: "Get the editable Run:ai CLI command catalog and saved overrides"
        request {
            type: object
            properties {}
        }
        response {
            type: object
            properties {
                catalog {
                    description: "Default Run:ai CLI commands grouped by CLI version (v1/v2)"
                    type: object
                    additionalProperties: true
                }
                overrides {
                    description: "Per-company command overrides grouped by CLI version"
                    type: object
                    additionalProperties: true
                }
            }
        }
    }
}

set_command_templates {
    "2.31" {
        description: "Persist Run:ai CLI command overrides for the company"
        request {
            type: object
            properties {
                overrides {
                    description: "Command overrides grouped by CLI version (v1/v2) and command key"
                    type: object
                    additionalProperties: true
                }
            }
        }
        response {
            type: object
            properties {
                updated {
                    description: "Number of updated records"
                    type: integer
                }
            }
        }
    }
}

run_command_playground {
    "2.31" {
        description: "Run a single editable Run:ai CLI command in the playground and queue an execution to poll"
        request {
            type: object
            properties {
                version {
                    description: "CLI version the command belongs to (v1/v2)"
                    type: string
                }
                key {
                    description: "Catalog command key being executed"
                    type: string
                }
                command {
                    description: "The command string to execute (with placeholders substituted)"
                    type: string
                }
                placeholders {
                    description: "Placeholder name/value pairs to substitute into the command"
                    type: object
                    additionalProperties: true
                }
            }
        }
        response {
            "$ref": "#/_definitions/execution_result"
        }
    }
}

submit_workload {
    "2.31" {
        description: "Submit a workload to the configured Run:ai cluster using the stored connection"
        request {
            type: object
            properties {
                workload {
                    description: "Workload parameters"
                    "$ref": "#/_definitions/workload_request"
                }
            }
        }
        response {
            "$ref": "#/_definitions/execution_result"
        }
    }
}

get_execution {
    "2.31" {
        description: "Get the result of a workload execution"
        request {
            type: object
            properties {
                execution_id {
                    description: "The execution ID to query"
                    type: string
                }
            }
        }
        response {
            "$ref": "#/_definitions/execution_result"
        }
    }
}

get_dashboard {
    "2.31" {
        description: "Get live Run:ai dashboard data"
        request {
            type: object
            properties {}
        }
        response {
            "$ref": "#/_definitions/dashboard_data"
        }
    }
}

get_project_resources {
    "2.31" {
        description: "Get Run:ai project assets (compute, environments, data sources) for a project"
        request {
            type: object
            properties {
                project {
                    description: "Run:ai project to resolve assets for. Falls back to the configured project."
                    type: string
                }
            }
        }
        response {
            "$ref": "#/_definitions/project_resources"
        }
    }
}

save_app_instance {
    "2.31" {
        description: "Save an autoscaler app instance configuration"
        request {
            type: object
            properties {
                workload {
                    description: "Workload parameters"
                    "$ref": "#/_definitions/workload_request"
                }
            }
        }
        response {
            type: object
            properties {
                status {
                    description: "Save status"
                    type: string
                }
                instance {
                    description: "Saved app instance"
                    type: object
                }
            }
        }
    }
}

delete_workload {
    "2.31" {
        description: "Delete or stop a Run:ai workload"
        request {
            type: object
            properties {
                instance_id {
                    description: "Saved autoscaler app instance id to remove"
                    type: string
                }
                workload_name {
                    description: "Name of the workload to delete"
                    type: string
                }
                workload_type {
                    description: "Type of workload: training, workspace, inference, or workload"
                    type: string
                }
                project {
                    description: "Run:ai project containing the workload"
                    type: string
                }
            }
        }
        response {
            "$ref": "#/_definitions/execution_result"
        }
    }
}

stop_workload {
    "2.31" {
        description: "Stop (suspend) a running Run:ai workload"
        request {
            type: object
            properties {
                instance_id {
                    description: "Saved autoscaler app instance id"
                    type: string
                }
                workload_name {
                    description: "Name of the workload to stop"
                    type: string
                }
                workload_type {
                    description: "Type of workload: training, workspace, inference, or workload"
                    type: string
                }
                project {
                    description: "Run:ai project containing the workload"
                    type: string
                }
            }
        }
        response {
            "$ref": "#/_definitions/execution_result"
        }
    }
}

get_workload_logs {
    "2.31" {
        description: "Get console log lines for a single Run:ai workload / app instance"
        request {
            type: object
            properties {
                instance_id {
                    description: "Saved autoscaler app instance id"
                    type: string
                }
                workload_name {
                    description: "Name of the workload to read logs for"
                    type: string
                }
                workload_type {
                    description: "Type of workload: training, workspace, inference, or workload"
                    type: string
                }
                project {
                    description: "Run:ai project containing the workload"
                    type: string
                }
                tail {
                    description: "Number of trailing log lines to request"
                    type: string
                }
            }
        }
        response {
            "$ref": "#/_definitions/workload_logs"
        }
    }
}

get_workload_info {
    "2.31" {
        description: "Fetch details/events/logs/metrics for one Run:ai workload via the REST API"
        request {
            type: object
            properties {
                workload_id {
                    description: "Run:ai workload id (uuid) to fetch info for"
                    type: string
                }
                instance_id {
                    description: "Saved autoscaler app instance id"
                    type: string
                }
                workload_name {
                    description: "Name of the workload"
                    type: string
                }
                project {
                    description: "Run:ai project containing the workload"
                    type: string
                }
            }
        }
        response {
            type: object
            additionalProperties: true
        }
    }
}
