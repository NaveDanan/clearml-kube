_description: "Authenticated ClearPipe definition lifecycle over native controller tasks. This service does not own a scheduler, database, or resource client."

_definitions {
    clearpipe_graph_v2 {
        type: object
        description: "Opaque ClearPipeGraphV2 document. CP-06 owns graph fields, node/port/binding semantics, diagnostics, and migrations; credentials and runtime task state are forbidden."
        additionalProperties: true
    }
    diagnostic {
        type: object
        description: "Opaque ClearPipe diagnostic. CP-11 owns diagnostic codes, target paths, severities, and migration-safe rendering."
        additionalProperties: true
    }
    compiler_output {
        type: object
        description: "Derived server compiler output. It can contain no-launch source, source-map spans, manifest metadata, and the typed runtime identity payload; it is not an editable graph or execution request."
        additionalProperties: true
    }
    runtime_metadata {
        type: object
        description: "Safe generated controller metadata. graph_node_id to pipeline_step_name records are the only supported graph-to-runtime correlation; source lines are not runtime identities."
        required: [schema_version, definition_revision, graph_schema_version, graph_digest, runtime_steps, source_map]
        properties {
            schema_version { type: integer }
            definition_revision { type: integer }
            graph_schema_version { type: integer }
            graph_digest { type: string }
            runtime_steps {
                type: array
                items {
                    type: object
                    required: [graph_node_id, pipeline_step_name]
                    properties {
                        graph_node_id { type: string }
                        pipeline_step_name { type: string }
                    }
                }
            }
            source_map {
                type: array
                items {
                    type: object
                    required: [graph_element_id, start_line, end_line]
                    properties {
                        graph_element_id { type: string }
                        start_line { type: integer }
                        end_line { type: integer }
                    }
                }
            }
        }
    }
    task_descriptor {
        type: object
        description: "Authorized safe base-task metadata for ClearPipe task-node ports. It intentionally excludes task configuration, source, every parameter value/default, artifact URIs, and runtime child IDs."
        required: [identity, context, parameters, artifacts]
        properties {
            identity {
                type: object
                required: [task_id]
                properties {
                    task_id { type: string }
                }
            }
            context {
                type: object
                required: [name, type, status]
                properties {
                    name { type: string }
                    type { type: string }
                    status { type: string }
                    project_id { type: string }
                    project_name { type: string }
                    updated_at { type: string, format: date-time }
                }
            }
            parameters {
                type: array
                items {
                    type: object
                    required: [section, name]
                    properties {
                        section { type: string }
                        name { type: string }
                        type { type: string }
                    }
                }
            }
            artifacts {
                type: array
                items {
                    type: object
                    required: [id, name]
                    properties {
                        id { type: string }
                        name { type: string }
                        type { type: string }
                        direction { type: string, enum: [input, output] }
                    }
                }
            }
        }
    }
    execution_snapshot {
        type: object
        description: "Authorized current ClearPipe v2 controller snapshot. Node records are correlated solely by persisted runtime graph_node_id to pipeline_step_name entries; omitted task fields, log payloads, source, configuration, parameter values, and artifact URLs are never transport data."
        required: [run_task_id, definition_task_id, definition_revision, graph_digest, controller, nodes, node_offset, total_nodes, truncated]
        properties {
            run_task_id { type: string }
            definition_task_id { type: string }
            definition_revision { type: integer }
            graph_digest { type: string }
            node_offset { type: integer }
            total_nodes { type: integer }
            truncated { type: boolean }
            next_node_offset { type: integer }
            controller {
                type: object
                required: [task_id, status]
                properties {
                    task_id { type: string }
                    status { type: string }
                    started_at { type: string, format: date-time }
                    completed_at { type: string, format: date-time }
                    updated_at { type: string, format: date-time }
                }
            }
            nodes {
                type: array
                items {
                    type: object
                    required: [graph_node_id, pipeline_step_name, record_status]
                    properties {
                        graph_node_id { type: string }
                        pipeline_step_name { type: string }
                        record_status { type: string, enum: [available, unavailable] }
                        task_id { type: string }
                        status { type: string }
                        started_at { type: string, format: date-time }
                        completed_at { type: string, format: date-time }
                        updated_at { type: string, format: date-time }
                        result { type: string, enum: [success, failure] }
                        log_task_id { type: string }
                        artifacts_truncated { type: boolean }
                        artifacts {
                            type: array
                            items {
                                type: object
                                required: [id, name]
                                properties {
                                    id { type: string }
                                    name { type: string }
                                    type { type: string }
                                    direction { type: string, enum: [input, output] }
                                }
                            }
                        }
                        models {
                            type: object
                            properties {
                                input {
                                    type: array
                                    items {
                                        type: object
                                        required: [id]
                                        properties {
                                            id { type: string }
                                            name { type: string }
                                        }
                                    }
                                }
                                output {
                                    type: array
                                    items {
                                        type: object
                                        required: [id]
                                        properties {
                                            id { type: string }
                                            name { type: string }
                                        }
                                    }
                                }
                            }
                        }
                        datasets {
                            type: array
                            items {
                                type: object
                                required: [task_id, name]
                                properties {
                                    task_id { type: string }
                                    name { type: string }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
    definition {
        type: object
        description: "Normalized ClearPipe definition stored on a tagged native controller task. configuration.ClearPipe is canonical; legacy Pipeline monitoring is derived only for v1, while v2 PipelineController runs publish their own monitoring state."
        required: [id, name, revision, graph]
        properties {
            id { type: string }
            name { type: string }
            description { type: string }
            project { type: string }
            project_name { type: string }
            user { type: string }
            company { type: string }
            tags {
                type: array
                items { type: string }
            }
            system_tags {
                type: array
                items { type: string }
            }
            archived { type: boolean }
            public { type: boolean }
            created {
                type: string
                format: date-time
            }
            last_update {
                type: string
                format: date-time
            }
            revision {
                description: "Optimistic-concurrency edit revision, not immutable version history."
                type: integer
            }
            graph {
                "$ref": "#/definitions/clearpipe_graph_v2"
            }
            validation {
                type: object
                description: "Latest deterministic server validation, including compiler diagnostics when generation is unsupported."
                additionalProperties: true
            }
            runtime {
                "$ref": "#/definitions/runtime_metadata"
            }
            capabilities {
                type: object
                description: "Server-derived task-boundary capabilities. Clients must additionally make legacy or unsupported graph representations read-only."
                required: [view, edit, save_as, version, run, import, export, source, archive, delete]
                properties {
                    view { type: boolean }
                    edit { type: boolean }
                    save_as { type: boolean }
                    version { type: boolean }
                    run { type: boolean }
                    compilation { type: boolean }
                    execution { type: boolean }
                    import { type: boolean }
                    export { type: boolean }
                    source { type: boolean }
                    archive { type: boolean }
                    delete { type: boolean }
                }
            }
            representation {
                type: string
                enum: [clearpipe_graph_v2, legacy_clearpipe_graph, unsupported_clearpipe_graph]
                description: "Representation classification only. CP-06 owns exact support and migration decisions."
            }
        }
    }
}

create {
    "2.35" {
        description: "Create a ClearPipe controller-task definition. Save As uses this operation with a new name; it does not create immutable version history."
        request {
            type: object
            required: [name, graph]
            properties {
                name {
                    type: string
                    description: "Definition name. The service rejects path-like names."
                }
                description { type: string }
                graph {
                    "$ref": "#/definitions/clearpipe_graph_v2"
                }
                tags {
                    type: array
                    items { type: string }
                }
                public {
                    type: boolean
                    default: false
                    description: "Public definitions remain mutable only by the origin company."
                }
            }
        }
        response {
            type: object
            required: [id, revision, definition]
            properties {
                id { type: string }
                revision { type: integer }
                definition {
                    "$ref": "#/definitions/definition"
                }
            }
        }
    }
}

get_all {
    "2.35" {
        description: "List visible ClearPipe definitions. Paging is server-authoritative; clients must not infer completeness from a short page."
        request {
            type: object
            properties {
                page {
                    type: integer
                    description: "Zero-based page index. Negative values are clamped by the service."
                }
                page_size {
                    type: integer
                    description: "Requested page size. The service clamps it to 1..500."
                }
                search { type: string }
                project {
                    type: array
                    items { type: string }
                }
                tags {
                    type: array
                    items { type: string }
                }
                include_archived {
                    type: boolean
                    default: false
                }
                allow_public {
                    type: boolean
                    default: true
                }
            }
        }
        response {
            type: object
            required: [definitions, total]
            properties {
                definitions {
                    type: array
                    items {
                        "$ref": "#/definitions/definition"
                    }
                }
                total {
                    type: integer
                    description: "Total matching definitions before paging."
                }
            }
        }
    }
}

get_by_id {
    "2.35" {
        description: "Load one visible ClearPipe definition."
        request {
            type: object
            required: [task]
            properties {
                task {
                    type: string
                    description: "Definition controller task ID."
                }
            }
        }
        response {
            type: object
            required: [definition]
            properties {
                definition {
                    "$ref": "#/definitions/definition"
                }
            }
        }
    }
}

update {
    "2.35" {
        description: "Compare-and-swap update of a definition owned by the caller company. A stale revision returns the ClearPipe 409 conflict."
        request {
            type: object
            required: [task, revision]
            properties {
                task { type: string }
                revision {
                    type: integer
                    description: "Expected edit revision."
                }
                name { type: string }
                description { type: string }
                graph {
                    "$ref": "#/definitions/clearpipe_graph_v2"
                }
                tags {
                    type: array
                    items { type: string }
                }
                public { type: boolean }
            }
        }
        response {
            type: object
            required: [updated, revision, definition]
            properties {
                updated { type: integer }
                revision { type: integer }
                definition {
                    "$ref": "#/definitions/definition"
                }
            }
        }
    }
}

validate {
    "2.35" {
        description: "Validate exactly one persisted definition or graph document. Validation authorizes referenced native resources and queues; it never returns credential values."
        request {
            type: object
            oneOf: [
                {required: [task]}
                {required: [graph]}
            ]
            properties {
                task { type: string }
                graph {
                    "$ref": "#/definitions/clearpipe_graph_v2"
                }
            }
        }
        response {
            type: object
            required: [valid, issues]
            properties {
                valid { type: boolean }
                issues {
                    type: array
                    items {
                        "$ref": "#/definitions/diagnostic"
                    }
                }
                pipeline {
                    "$ref": "#/definitions/compiler_output"
                }
            }
        }
    }
}

start {
    "2.35" {
        description: "Revalidate a saved definition, clone it through the native task lifecycle, and enqueue one controller run. Existing /pipelines remains the run-details and rerun owner."
        request {
            type: object
            required: [task]
            properties {
                task { type: string }
                revision {
                    type: integer
                    description: "Optional expected definition revision. Supply it for a user-initiated run."
                }
                queue {
                    type: string
                    description: "Existing ClearML controller queue ID. The default queue is used when omitted."
                }
                parameters {
                    type: object
                    additionalProperties: true
                    description: "JSON-safe controller parameter overrides. Secret values are prohibited."
                }
                node_queues {
                    type: object
                    additionalProperties { type: string }
                    description: "Node queue overrides interpreted only by the current compiler contract."
                }
                verify_watched_queue {
                    type: boolean
                    default: true
                    description: "Advisory worker observation after enqueue; false does not undo a successful submission."
                }
            }
        }
        response {
            type: object
            required: [task, enqueued]
            properties {
                task {
                    type: string
                    description: "Immutable cloned controller run task ID."
                }
                enqueued { type: boolean }
                queue_watched { type: boolean }
            }
        }
    }
}

task_descriptor {
    "2.35" {
        description: "Return only authorized, safe task metadata needed to construct canonical task-node parameter and artifact ports. The stable base task ID is authoritative; project/name are display context only."
        request {
            type: object
            required: [task]
            properties {
                task { type: string }
                known_updated_at {
                    type: string
                    format: date-time
                    description: "Previously observed task update timestamp. A differing current timestamp returns status=stale with current safe metadata."
                }
            }
        }
        response {
            type: object
            required: [status]
            properties {
                status { type: string, enum: [available, stale, unavailable] }
                descriptor {
                    "$ref": "#/definitions/task_descriptor"
                }
            }
        }
    }
}

execution_snapshot {
    "2.35" {
        description: "Return an authorized, current ClearPipe v2 controller snapshot only when the submitted run has a server-signed provenance record that binds its exact ClearPipeRuntime map, definition, revision, digest, run, and company. It is a concise status/handoff boundary, not an operational dashboard."
        request {
            type: object
            required: [run]
            properties {
                run { type: string }
                definition_revision {
                    type: integer
                    description: "Previously observed definition revision. A mismatch returns status=stale and the current safe snapshot."
                }
                graph_digest {
                    type: string
                    description: "Previously observed compiled graph digest. A mismatch returns status=stale and the current safe snapshot."
                }
                node_offset {
                    type: integer
                    description: "Zero-based runtime-node page offset. The service clamps negative values to zero."
                }
                node_limit {
                    type: integer
                    description: "Requested runtime-node page size. The service clamps it to 1..100."
                }
            }
        }
        response {
            type: object
            required: [status]
            properties {
                status { type: string, enum: [available, stale, unavailable] }
                snapshot {
                    "$ref": "#/definitions/execution_snapshot"
                }
            }
        }
    }
}

archive {
    "2.35" {
        description: "Archive an owned definition using compare-and-swap revision semantics."
        request {
            type: object
            required: [task]
            properties {
                task { type: string }
                revision { type: integer }
            }
        }
        response {
            type: object
            required: [updated, revision]
            properties {
                updated { type: integer }
                revision { type: integer }
            }
        }
    }
}

delete {
    "2.35" {
        description: "Delete an owned definition. The service requires archive-first unless force is authorized by the existing task lifecycle."
        request {
            type: object
            required: [task]
            properties {
                task { type: string }
                revision { type: integer }
                force {
                    type: boolean
                    default: false
                }
            }
        }
        response {
            type: object
            required: [deleted]
            properties {
                deleted { type: boolean }
            }
        }
    }
}

parse_script {
    "2.35" {
        description: "Safely parse Python source metadata without executing source."
        request {
            type: object
            required: [script]
            properties {
                script { type: string }
                filename {
                    type: string
                    default: script.py
                }
            }
        }
        response {
            type: object
            required: [valid, parameters, environment, imports, line_count]
            properties {
                valid { type: boolean }
                parameters {
                    type: array
                    items {
                        type: object
                        additionalProperties: true
                    }
                }
                environment {
                    type: array
                    items { type: string }
                }
                imports {
                    type: array
                    items { type: string }
                }
                line_count { type: integer }
            }
        }
    }
}
